    ${S.gold < 0 ? `<div class="warn" style="margin-top:12px">You're ${-S.gold}g in debt. ${S.debtNights >= 1 ? 'Last warning: still in the red tomorrow night and the bank takes the guild.' : 'Still in the red tomorrow night? The bank sends its ogre.'}</div>` : ''}
    ${res.length ? `<div class="sect">Today's tales</div><div class="feed">${res.map(r => `<div class="line"><span>${r.result === 'win' ? '✓' : '✗'} ${esc(r.title)}</span><span class="num">${r.result === 'win' ? '+' + r.net + 'g' : '0g'} · ${r.renown >= 0 ? '+' : ''}${r.renown} renown</span></div>`).join('')}</div>` : ''}
    ${news.length ? `<div class="sect">Guild news</div><ul class="news">${news.map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join('')}</ul>` : ''}
    ${E.hall.length ? `<div class="sect">Where their gold went</div><div class="feed">${E.hall.slice(0, 7).map(h => `<div class="line"><span><b>${esc(h.who)}</b> at ${esc(h.where)}. <em>${esc(h.text)}</em></span><span class="num">+${h.cut}g</span></div>`).join('')}${E.hall.length > 7 ? `<div class="hint" style="color:var(--muted)">…and ${E.hall.length - 7} more transactions of questionable wisdom.</div>` : ''}</div>` : ''}
    ${ev ? `<div class="sect">Meanwhile</div><div class="card drama"><p>${esc(ev.text)}</p>${E.eventDone ? `<div class="res">${esc(E.eventResult)}</div>` : `<div class="choices">${ev.choices.map((c, i) => `<button class="big ink" data-act="event" data-i="${i}">${esc(c)}</button>`).join('')}</div>`}</div>` : ''}
    ${rec ? `<div class="sect">Someone at the door</div><div class="card"><div class="recruit"><img src="${portrait(Object.assign({ status: 'ready' }, rec.def), 96)}" alt=""><div><h3 style="font-size:24px">${esc(rec.def.name)}</h3><div class="hint" style="color:var(--muted)">${rec.def.cls} · wants ${rec.fee}g to sign</div><div>${rec.def.traits.map(t => `<span class="trait" title="${esc(TRAITS[t])}">${t}</span>`).join('')}<span class="trait fear">Fears ${rec.def.fear}s</span></div><p style="margin:8px 0 0;font-size:14px">${esc(rec.def.bio)}</p></div></div>
      <div class="actions" style="margin-top:10px"><button class="big brass" data-act="hire" ${S.gold < rec.fee ? 'disabled' : ''}>Hire (${rec.fee}g)</button><button class="big ghost" data-act="pass">Not today</button></div></div>` : ''}
    <div class="cta"><button class="big red" data-act="sleep" ${ev && !E.eventDone ? 'disabled' : ''}>${ev && !E.eventDone ? 'Deal with the drama first' : 'Sleep it off → Day ' + (S.day + 1)}</button></div>`;
}

/* ---------------- end screens ---------------- */
function renderEnd() {
  const S = GAME.S;
  if (S.phase === 'won') return `<div class="phase-head"><div class="eyebrow">Day ${S.day}</div><h2>Royal Charter granted</h2>
    <p>The King's herald arrives, reads a proclamation, trips on Brother Vale, and hands you a charter with a wax seal the size of a dinner plate. The guild is official. The heroes are insufferable.</p></div>
    ${statsBlock(S)}
    <div class="cta"><button class="big brass" data-act="keepgoing">Keep running the guild</button><div class="sub"><button class="big ghost" style="margin-top:8px;width:100%" data-act="newgame">Start a new guild</button></div></div>`;
  const why = S.overReason === 'debt' ? 'Two nights in the red. The bank’s ogre arrived at dawn, read the ledger, wept a little, and changed the locks.' : 'Every last hero is dead, gone, or farming goats. The guild is just you and a cat now.';
  return `<div class="phase-head"><div class="eyebrow">Day ${S.day}</div><h2>The guild has fallen</h2><p>${why}</p></div>
    ${statsBlock(S)}
    <div class="cta"><button class="big red" data-act="newgame">Try again, wiser. Or not.</button></div>`;
}
function statsBlock(S) {
  const best = S.heroes.slice().sort((a, b) => b.st.wins - a.st.wins)[0];
  return `<div class="ledger"><h3>The record</h3>
    <div class="row"><span>Days survived</span><b class="num">${S.day}</b></div>
    <div class="row"><span>Jobs won / lost</span><b class="num">${S.stats.wins} / ${S.stats.losses}</b></div>
    <div class="row"><span>Heroes lost</span><b class="num">${S.stats.deaths}</b></div>
    <div class="row"><span>Renown</span><b class="num">${S.renown}</b></div>
    ${best ? `<div class="row"><span>Star performer</span><b>${esc(best.name)} (${best.st.wins} wins)</b></div>` : ''}</div>`;
}

/* ---------------- roster ---------------- */
function statusChip(h) {
  const t = h.status === 'wounded' ? `Wounded ${h.wound}d` : h.status === 'dead' ? 'Dead' : h.status === 'gone' ? 'Left' : 'Ready';
  return `<span class="st ${h.status}">${t}</span>`;
}
function renderRoster() {
  const S = GAME.S;
  const order = { ready: 0, wounded: 1, dead: 2, gone: 3 };
  const hs = S.heroes.slice().sort((a, b) => order[a.status] - order[b.status] || b.lvl - a.lvl);
  return `<div class="phase-head"><div class="eyebrow">The roster</div><h2>Your adventurers</h2><p>They work for themselves. You just provide the paperwork and the blame.</p></div>
  <div class="roster">${hs.map(h => `<button class="hcard" data-act="hero" data-id="${h.id}"><img src="${portrait(h, 64)}" alt="">
    <div><div class="top"><h3>${esc(h.name)}</h3>${statusChip(h)}</div>
    <div class="sub">Lv ${h.lvl} ${h.cls} · ${h.gold}g in pocket</div>
    <div class="bars"><span>HP</span><div class="b"><i style="width:${h.hp / heroMax(h) * 100}%;background:#4fae82"></i></div><span>Mood</span><div class="b"><i style="width:${h.morale}%;background:${h.morale < 30 ? '#b8382c' : '#d6a54a'}"></i></div></div>
    <div>${h.traits.map(t => `<span class="trait">${t}</span>`).join('')}<span class="trait fear">${h.fear}s</span></div></div></button>`).join('')}</div>`;
}
function heroModal(id) {
  const S = GAME.S, h = S.heroes.find(x => x.id === id); if (!h) return;
  const rels = Object.entries(h.rel).map(([n, k]) => `<li>${k === 'crush' ? 'Has a thing for' : k === 'rival' ? 'Rivals with' : 'Friends with'} <b>${esc(n)}</b></li>`);
  S.heroes.forEach(o => { if (o.rel[h.name] === 'crush' && h.rel[o.name] !== 'crush') rels.push(`<li><b>${esc(o.name)}</b> has a thing for them</li>`); });
  const canRes = h.status === 'dead' && S.hall.infirmary >= 3;
  openModal(`<div class="row2"><img src="${portrait(h, 96)}" alt=""><div><h2>${esc(h.name)}</h2><div>Level ${h.lvl} ${h.cls} · ${statusChip(h)}</div>
    <div style="margin-top:6px">${h.traits.map(t => `<span class="trait" title="${esc(TRAITS[t])}">${t}</span>`).join('')}<span class="trait fear">Fears ${h.fear}s</span></div></div></div>
    <p style="font-family:var(--font-letter);font-size:18px;margin:12px 0 0">${esc(h.bio)}</p>
    <div class="statgrid"><div><b>${Math.round(h.hp)}/${heroMax(h)}</b>HP</div><div><b>${heroAtk(h).toFixed(0)}</b>Attack</div><div><b>${heroDef(h).toFixed(0)}</b>Defence</div><div><b>${h.morale}</b>Mood</div>
      <div><b>${h.xp}/${xpNeed(h)}</b>XP</div><div><b>${h.gear}</b>Gear</div><div><b>${h.gold}g</b>Purse</div><div><b>${h.st.wins}/${h.st.missions}</b>Wins</div></div>
    <h4>Traits</h4><ul>${h.traits.map(t => `<li><b>${t}:</b> ${esc(TRAITS[t])}</li>`).join('')}<li><b>Phobia:</b> won't go near ${h.fear}s if they can help it.</li></ul>
    ${rels.length ? `<h4>Entanglements</h4><ul>${rels.join('')}</ul>` : ''}
    <h4>History</h4>${h.hist.length ? `<ul>${h.hist.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="hint">Nothing notable yet. Give it time.</p>'}
    <h4>Record</h4><p style="margin:0;font-size:14px">${h.st.kills} kills · ${h.st.downs} times knocked flat · fled ${h.st.fled} times · earned ${h.st.earned}g</p>
    ${canRes ? `<button class="big brass close" data-act="resurrect" data-id="${h.id}" ${S.gold < resurrectCost(h) ? 'disabled' : ''}>Resurrect (${resurrectCost(h)}g)</button>` : ''}
    <button class="big ink close" data-act="close">Close</button>`);
}

/* ---------------- hall ---------------- */
function renderHall() {
  const S = GAME.S;
  const canBuild = S.phase === 'morning' || S.phase === 'evening';
  return `<div class="phase-head"><div class="eyebrow">The guild hall</div><h2>Improvements</h2>
    <p>Heroes spend their wages here, and you take a cut. Pay them well and the money comes home. Upkeep tonight: <b class="num">${upkeep(S)}g</b>.</p></div>
    ${canBuild ? '' : '<div class="warn" style="margin-bottom:12px">The builders refuse to work while the heroes are out. Union rules. Come back in the morning or evening.</div>'}
    ${Object.entries(FACILITIES).map(([k, f]) => {
      const lv = S.hall[k], max = lv >= f.max, cost = max ? 0 : upgradeCost(S, k);
      return `<div class="fac"><div class="top"><div><div class="kind">${f.kind}</div><h3>${esc(f.name)}</h3></div><div class="lv">${Array.from({ length: f.max }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('')}</div></div>
        <div class="now">${esc(f.lvl[lv])}</div><p>${esc(f.desc)}</p>
        ${max ? '<p style="color:var(--brass)">Fully upgraded. Gaudy, even.</p>' : `<button class="big ${S.gold >= cost && canBuild ? 'brass' : 'ghost'}" data-act="upgrade" data-k="${k}" ${S.gold >= cost && canBuild ? '' : 'disabled'}>${lv ? 'Upgrade' : 'Build'} to “${esc(f.lvl[lv + 1])}” · ${cost}g</button>`}</div>`;
    }).join('')}
    ${S.heroes.some(h => h.status === 'dead') && S.hall.infirmary >= 3 ? '<p class="hint" style="color:var(--muted)">The resurrection chapel is open. Visit a fallen hero on the roster.</p>' : ''}`;
}

/* ---------------- chronicle ---------------- */
function renderLog() {
  const S = GAME.S;
  return `<div class="phase-head"><div class="eyebrow">The chronicle</div><h2>Gossip & history</h2><p>What the town is saying about you. Mostly true.</p></div>
    <div class="log">${S.log.map(e => `<div class="e ${e.kind}"><small>Day ${e.day}</small>${esc(e.text)}</div>`).join('') || '<p class="hint">Nothing has happened yet. Enjoy it.</p>'}</div>`;
}

/* ---------------- modal ---------------- */
function openModal(html) { const o = $('#overlay'); o.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; o.hidden = false; }
function closeModal() { const o = $('#overlay'); o.hidden = true; o.innerHTML = ''; }

/* ---------------- actions ---------------- */
const ACT = {
  tab(d) { GAME.tab = d.tab; SFX.click(); render(); $('#main').scrollTop = 0; },
  mute() { SFX.toggle(); renderTop(); },
  newgame() {
    SFX.unlock(); SFX.paper();
    GAME.S = newGame(); GAME.title = null; GAME.tab = 'today'; GAME.open = null; GAME.mNode = null; save();
    render();
    openModal(`<h2>A letter on the desk</h2><div class="lettertext">${esc(INTRO_LETTER)}</div><button class="big red close" data-act="close">Take the keys</button>`);
  },
  continue() { SFX.unlock(); SFX.click(); GAME.S = loadSave(); GAME.title = null; GAME.tab = 'today'; render(); },
  close() { closeModal(); },
  toggle(d) { const id = +d.pid; GAME.open = GAME.open === id ? null : id; SFX.paper(); render(); const n = $('#n-' + id); if (n && GAME.open) n.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  scout(d) {
    const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid), c = scoutCost(S, p);
    if (p.scouted || S.gold < c) return;
    S.gold -= c; S.today.costs += c; p.scouted = true; SFX.stamp();
    if (p.actualThreat !== p.threat) toast(`Scout: it's not ${an(p.threat)} ${p.threat}. It's ${an(p.actualThreat)} ${p.actualThreat.toUpperCase()}.`);
    save(); render();
  },
  pot(d) { const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid); p.potions = clamp(p.potions + (+d.d), 0, 3); SFX.click(); save(); render(); },
  downplay(d) { const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid); p.downplay = !p.downplay; SFX.click(); save(); render(); },
  post(d) {
    const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid);
    const cost = p.potions * POTION_PRICE; if (S.gold < cost) return;
    S.gold -= cost; S.today.costs += cost; p.status = 'posted'; SFX.stamp(); GAME.open = null; save(); render();
  },
  unpost(d) { const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid); S.gold += p.potions * POTION_PRICE; S.today.costs -= p.potions * POTION_PRICE; p.status = 'new'; SFX.paper(); save(); render(); },
  bin(d) {
    const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid);
    if (p.status === 'binned') { p.status = 'new'; render(); return; }
    p.status = 'binned'; SFX.stamp(); GAME.open = null; toast(fill(pickH(CLIENT_SNUBS, 'snub' + p.uid), { client: p.client })); save(); render();
  },
  opendoors() { SFX.paper(); enterBoard(); },
  dayoff() { GAME.S.today.parties = {}; note(GAME.S, 'The guild took the day off. The heroes call it a "wellness day".', 'info'); toEvening(); },
  sweeten(d) {
    const S = GAME.S, p = S.petitions.find(x => x.uid === +d.pid);
    p.cutPct = Math.min(150, p.cutPct + 15); SFX.coin();
    reform(`Nobody bites at ${p.cutPct}%. They can smell desperation.`);
  },
  round() {
    const S = GAME.S, n = readyHeroes(S).length, c = 4 * n;
    if (S.today.round || S.gold < c) return;
    S.gold -= c; S.today.costs += c; S.today.round = true;
    readyHeroes(S).forEach(h => { h.morale = clamp(h.morale + (has(h, 'Drunkard') ? 22 : 11), 0, 100); });
    SFX.coin(); reform('A round is bought. Spirits rise. Decisions do not change.');
  },
  speech() {
    const S = GAME.S; if (S.today.speech) return; S.today.speech = true;
    if (R(S) < 0.55) { readyHeroes(S).forEach(h => { h.morale = clamp(h.morale + 13, 0, 100); }); toast('A rousing speech! Someone at the back started a slow clap. It caught on.'); }
    else { readyHeroes(S).forEach(h => { h.morale = clamp(h.morale - 6, 0, 100); }); toast(pickH(['You compare them to "a family". Several wince.', 'You mispronounce "valour". Twice. Morale dips.', 'Mid-speech, you call Brenna "Brendan". Morale dips.'], 'sp' + S.day)); }
    reform();
  },
  sendoff() { SFX.curtain(); sendOff(); },
  speed(d) { GAME.speed = +d.s; try { localStorage.setItem('hss-speed', d.s); } catch (e) {} if (GAME.theatre) GAME.theatre.speed = GAME.speed; GAME.mNode.querySelectorAll('[data-act=speed]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.s === GAME.speed))); SFX.click(); },
  skip() { skipMission(); },
  iv(d) { chooseIntervention(d.c); },
  nexttale() { SFX.click(); GAME.mNode = null; render(); $('#main').scrollTop = 0; },
  toevening() { toEvening(); },
  event(d) { resolveEvent(GAME.S, +d.i); SFX.paper(); save(); render(); },
  hire() { const h = hireRecruit(GAME.S); if (h) { SFX.coin(); toast(`${h.name} joins the guild. Already complaining.`); } save(); render(); },
  pass() { passRecruit(GAME.S); save(); render(); },
  sleep() {
    const S = GAME.S;
    const rk = rankIndex(S.renown);
    if (rk > (S.lastRank || 0)) { S.lastRank = rk; note(S, `The guild is now "${RANKS[rk].name}". Fancier clients will start writing in.`, 'big'); setTimeout(() => toast(`Rank up: ${RANKS[rk].name}! Fancier clients incoming.`), 900); }
    const r = endNight(S); save();
    if (r === 'next') { GAME.open = null; toast(`Day ${S.day}. The post has arrived.`); SFX.paper(); }
    else if (r === 'won') SFX.win(); else SFX.lose();
    render(); $('#main').scrollTop = 0;
  },
  keepgoing() { const S = GAME.S; S.day++; startDay(S); save(); render(); },
  hero(d) { SFX.paper(); heroModal(+d.id); },
  resurrect(d) { const S = GAME.S, h = S.heroes.find(x => x.id === +d.id); if (resurrect(S, h)) { SFX.heal(); closeModal(); save(); render(); toast(`${h.name} is back. Smells faintly of soil.`); } },
  upgrade(d) { if (upgrade(GAME.S, d.k)) { SFX.coin(); save(); render(); toast(`${FACILITIES[d.k].name}: ${FACILITIES[d.k].lvl[GAME.S.hall[d.k]]}.`); } }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset, el); }
});
document.addEventListener('input', e => {
  const el = e.target; if (el.dataset.input !== 'cut') return;
  const p = GAME.S.petitions.find(x => x.uid === +el.dataset.pid); if (!p) return;
  p.cutPct = +el.value; refreshPetition(p);
});
document.addEventListener('change', e => { if (e.target.dataset.input === 'cut') save(); });
$('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('resize', () => { if (GAME.theatre && GAME.S && GAME.S.phase === 'missions') GAME.theatre.resize(); });

function boot(data) {
  if (data && data.S && data.S.v === 2) { GAME.S = data.S; GAME.tab = data.tab || 'today'; GAME.title = null; }
  else GAME.title = true;
  render();
}
if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => (GAME.S && !GAME.title ? { S: GAME.S, tab: GAME.tab } : {}));
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});

</script>
</body>
</html>
