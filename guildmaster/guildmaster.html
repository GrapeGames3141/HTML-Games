<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heroes Sold Separately</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;700;800;900&family=Grenze+Gotisch:wght@400;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  /* Paper-puppet guild hall: dark stage, pinned parchment notices, oxblood curtains, brass tacks. One-column phone layout. */
  --stage: #17110f;
  --wood: #2b1d17;
  --wood-2: #3a281f;
  --parch: #efe1c0;
  --parch-2: #e2cfa4;
  --parch-ink: #2a1d14;
  --curtain: #8f2433;
  --brass: #d6a54a;
  --good: #3f8f6e;
  --bad: #b8382c;
  --light: #f3e7cf;
  --muted: #b9a585;
  --font-display: 'Grenze Gotisch', 'UnifrakturCook', Georgia, serif;
  --font-letter: 'IM Fell English', 'Iowan Old Style', Georgia, serif;
  --font-ui: 'Alegreya Sans', 'Trebuchet MS', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--stage);
  background-image:
    radial-gradient(120% 70% at 50% 0%, rgba(214, 165, 74, .10), transparent 60%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px),
    linear-gradient(var(--wood), var(--stage));
  color: var(--light);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; position: relative; }
#top {
  flex: none; padding: max(10px, env(safe-area-inset-top)) 16px 8px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center;
  background: linear-gradient(#211613, rgba(33,22,19,.92)); border-bottom: 1px solid rgba(214,165,74,.25); position: relative; z-index: 3;
}
#top .tl { min-width: 0; }
#top .guild { font-family: var(--font-display); font-size: 25px; line-height: 1; color: var(--brass); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .rank { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
#top .stats { display: flex; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; background: rgba(0,0,0,.35); border: 1px solid rgba(214,165,74,.3); font-size: 14px; font-weight: 700; white-space: nowrap; }
.chip.gold b { color: #f2c75a; }
.chip.debt { border-color: var(--bad); color: #ff9a8a; animation: pulse 1.2s infinite; }
.coin { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe7a0, #c9922e 70%); box-shadow: inset 0 0 0 1px #7a5418; flex: none; }
.renownbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.renownbar .bar { flex: 1; height: 6px; background: rgba(0,0,0,.45); border-radius: 3px; overflow: hidden; border: 1px solid rgba(214,165,74,.2); }
.renownbar .bar i { display: block; height: 100%; background: linear-gradient(90deg, #8f2433, var(--brass)); transition: width .6s; }
.iconbtn { background: none; border: 1px solid rgba(214,165,74,.3); border-radius: 8px; width: 34px; height: 30px; display: grid; place-items: center; color: var(--muted); padding: 0; }

#main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 16px 24px; -webkit-overflow-scrolling: touch; }
#nav {
  flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: #1b1210; border-top: 1px solid rgba(214,165,74,.25);
  padding-bottom: env(safe-area-inset-bottom); position: relative; z-index: 3;
}
#nav button { background: none; border: 0; padding: 9px 2px 8px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); position: relative; }
#nav button b { display: block; font-family: var(--font-display); font-size: 19px; letter-spacing: 0; text-transform: none; color: var(--light); font-weight: 400; line-height: 1.1; }
#nav button[aria-current="page"] { color: var(--brass); }
#nav button[aria-current="page"] b { color: var(--brass); }
#nav button[aria-current="page"]::before { content: ''; position: absolute; top: -1px; left: 25%; right: 25%; height: 2px; background: var(--brass); }
#nav .dot { position: absolute; top: 8px; right: 22%; width: 8px; height: 8px; border-radius: 50%; background: var(--curtain); box-shadow: 0 0 0 2px #1b1210; }

h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.05; }
.phase-head { margin: 2px 0 14px; }
.phase-head .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--brass); }
.phase-head h2 { font-size: 34px; color: var(--light); }
.phase-head p { margin: 4px 0 0; color: var(--muted); font-size: 15px; max-width: 60ch; }
.sect { margin: 22px 0 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.sect::after { content: ''; flex: 1; height: 1px; background: rgba(214,165,74,.2); }

.howto { background: rgba(214,165,74,.1); border: 1px dashed rgba(214,165,74,.45); border-radius: 10px; padding: 10px 12px; margin-bottom: 18px; font-size: 14px; }
.howto b { color: var(--brass); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.howto ol { margin: 6px 0; padding-left: 20px; } .howto li { margin: 2px 0; } .howto span { color: var(--muted); font-size: 13px; }
/* ---- pinned notices ---- */
.notices { display: flex; flex-direction: column; gap: 16px; }
.notice {
  position: relative; background: var(--parch); color: var(--parch-ink); border-radius: 3px; padding: 14px 14px 12px 64px;
  box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 8px 18px rgba(0,0,0,.45), 0 2px 3px rgba(0,0,0,.4);
  background-image: radial-gradient(130% 90% at 30% 10%, rgba(255,250,235,.6), transparent 60%), linear-gradient(transparent 85%, rgba(120,80,30,.12));
  transform: rotate(var(--tilt, 0deg)); transition: transform .2s;
}
.notice::before { /* brass tack */
  content: ''; position: absolute; top: -6px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #ffe9a8, var(--brass) 55%, #6d4b16); box-shadow: 0 2px 2px rgba(0,0,0,.5);
}
.notice.open { transform: rotate(0deg); }
.notice.dim { opacity: .62; }
.notice .head { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 0; color: inherit; }
.seal {
  position: absolute; left: 12px; top: 14px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--font-display); font-size: 21px; color: rgba(255,255,255,.88); background: var(--seal, #8f2433);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), inset 2px 3px 4px rgba(255,255,255,.25), 0 2px 3px rgba(0,0,0,.35);
}
.notice h3 { font-size: 23px; color: #2a140e; padding-right: 4px; }
.notice .from { font-size: 13px; color: #6a5236; margin-top: 2px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; padding: 2px 8px; border-radius: 4px; background: rgba(42,29,20,.08); border: 1px solid rgba(42,29,20,.18); color: #3a2a1c; font-weight: 700; }
.tag img { width: 20px; height: 20px; border-radius: 3px; margin: -2px 0 -2px -4px; }
.tag.offer { background: #2a1d14; color: #f2c75a; border-color: #2a1d14; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 8px; height: 8px; border-radius: 2px; background: rgba(42,29,20,.18); transform: rotate(45deg); }
.pips i.on { background: #a8342e; }
.pips.unknown i.on { background: #c98a5a; }
.job .pips i { background: rgba(255,255,255,.14); } .job .pips i.on { background: #e0604a; } .job .pips.unknown i.on { background: #e0a070; }
.letter { font-family: var(--font-letter); font-style: italic; font-size: 18px; line-height: 1.45; margin: 12px 0 8px -50px; padding: 12px 4px 0; border-top: 1px dashed rgba(42,29,20,.3); color: #2e1e12; }
.letter .sig { display: block; text-align: right; margin-top: 4px; font-size: 16px; }
.terms { margin-left: -50px; display: flex; flex-direction: column; gap: 12px; }
.terms label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #6a5236; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; }
.terms label b { letter-spacing: 0; text-transform: none; font-size: 14px; color: #2a1d14; }
input[type=range] { width: 100%; accent-color: var(--curtain); height: 28px; }
.split { display: flex; justify-content: space-between; font-size: 14px; color: #4a3626; margin-top: -4px; }
.split b { color: #2a1d14; }
.interest { display: flex; flex-wrap: wrap; gap: 6px; }
.face { position: relative; width: 38px; height: 38px; }
.face img { width: 38px; height: 38px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(42,29,20,.35); display: block; }
.face .b { position: absolute; right: -4px; bottom: -4px; width: 19px; height: 19px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 900; color: #fff; box-shadow: 0 0 0 2px var(--parch); }
.face.eager .b { background: #c23a5a; } .face.yes .b { background: var(--good); } .face.maybe .b { background: #c9922e; } .face.no .b { background: #6a5a4a; }
.face.no img { filter: grayscale(.8) brightness(.85); }
.quotes { flex-basis: 100%; display: flex; flex-direction: column; gap: 4px; margin-top: 6px; font-size: 14px; color: #3a2a1c; }
.quotes p { margin: 0; padding: 5px 8px; background: rgba(63,143,110,.12); border-radius: 4px; }
.quotes p.nah { background: rgba(168,52,46,.1); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.pbtn { border: 1.5px solid #2a1d14; background: transparent; color: #2a1d14; border-radius: 6px; padding: 7px 11px; font-size: 14px; font-weight: 700; min-height: 40px; }
.pbtn.on { background: #2a1d14; color: var(--parch); }
.pbtn:disabled { opacity: .45; cursor: not-allowed; }
.stepper { display: inline-flex; align-items: center; border: 1.5px solid #2a1d14; border-radius: 6px; overflow: hidden; }
.stepper button { border: 0; background: none; width: 36px; height: 38px; font-size: 18px; font-weight: 900; color: #2a1d14; }
.stepper span { min-width: 92px; text-align: center; font-size: 14px; font-weight: 700; }
.hint { font-size: 13px; color: #6a5236; font-style: italic; }
.actions { display: flex; gap: 8px; }
.actions .big { flex: 1; }
.big { min-height: 48px; border-radius: 8px; border: 0; font-weight: 800; font-size: 16px; letter-spacing: .02em; padding: 10px 16px; }
.big.ink { background: #2a1d14; color: var(--parch); }
.big.red { background: var(--curtain); color: #fff3e6; box-shadow: 0 3px 0 #5a1420; }
.big.brass { background: var(--brass); color: #2a1406; box-shadow: 0 3px 0 #8a6420; }
.big.ghost { background: transparent; border: 1.5px solid currentColor; }
.big:disabled { opacity: .45; cursor: not-allowed; }
.big:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }

.stamp {
  position: absolute; right: 10px; top: 10px; font-family: var(--font-display); font-size: 22px; letter-spacing: .06em; padding: 1px 10px 3px;
  border: 3px double currentColor; border-radius: 6px; transform: rotate(-11deg); opacity: .85; pointer-events: none; text-transform: uppercase;
  -webkit-mask-image: radial-gradient(circle at 30% 40%, #000 60%, rgba(0,0,0,.6) 61%, #000 75%); animation: stampIn .35s cubic-bezier(.2,1.6,.4,1) both;
}
.stamp.posted { color: #2f7a58; } .stamp.binned { color: #a8342e; } .stamp.scouted { color: #2e5a8a; right: auto; left: 70px; top: auto; bottom: 8px; font-size: 16px; transform: rotate(4deg); }
@keyframes stampIn { from { transform: scale(2.2) rotate(-25deg); opacity: 0; } to { transform: scale(1) rotate(-11deg); opacity: .85; } }

.cta { position: sticky; bottom: -24px; margin: 18px -16px -24px; padding: 18px 16px 16px; background: linear-gradient(rgba(23,17,15,0), rgba(23,17,15,.97) 34%); z-index: 2; }
.cta .big { width: 100%; }
.cta .sub { text-align: center; font-size: 13px; color: var(--muted); margin-top: 6px; }

/* ---- board reactions ---- */
.job { background: rgba(239,225,192,.06); border: 1px solid rgba(214,165,74,.22); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
.job h3 { font-size: 22px; color: var(--light); }
.job .meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.party { display: flex; gap: 6px; margin: 10px 0 6px; flex-wrap: wrap; }
.party .slot { width: 46px; height: 46px; border-radius: 50%; border: 2px dashed rgba(214,165,74,.35); display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.party img { width: 46px; height: 46px; border-radius: 50%; box-shadow: 0 0 0 2px var(--brass); animation: popIn .4s both; }
@keyframes popIn { from { transform: scale(.3); opacity: 0; } }
.react { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: start; margin-top: 10px; }
.anim .react { animation: rise .45s both; }
.react img { width: 40px; height: 40px; border-radius: 50%; }
.react .bub { background: var(--parch); color: var(--parch-ink); border-radius: 4px 12px 12px 12px; padding: 7px 10px; font-size: 15px; position: relative; }
.react .bub .who { font-weight: 800; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; color: #5a3a22; }
.react .bub .why { font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; background: rgba(42,29,20,.1); }
.react.no .bub { background: #d9c8a8; opacity: .92; }
.react.flip .bub { box-shadow: 0 0 0 2px var(--brass); }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
.levers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lever { background: rgba(0,0,0,.25); border: 1px solid rgba(214,165,74,.3); border-radius: 8px; padding: 9px 10px; text-align: left; color: var(--light); min-height: 56px; }
.lever b { display: block; font-size: 15px; }
.lever span { font-size: 12px; color: var(--muted); }
.lever:disabled { opacity: .4; }
.sweeten { margin-top: 8px; width: 100%; background: transparent; border: 1.5px dashed var(--brass); color: var(--brass); border-radius: 8px; padding: 8px; font-weight: 800; font-size: 14px; }
.toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); background: var(--parch); color: var(--parch-ink); padding: 8px 14px; border-radius: 6px; font-weight: 800; box-shadow: 0 8px 20px rgba(0,0,0,.5); z-index: 50; animation: toast 2.8s both; max-width: min(92vw, 480px); text-align: center; font-size: 15px; pointer-events: none; }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, -10px); } 10%, 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* ---- theatre ---- */
.stagebox { position: relative; border-radius: 10px; overflow: hidden; background: #000; box-shadow: 0 10px 28px rgba(0,0,0,.6), 0 0 0 2px #4a2a1a, 0 0 0 5px #24140e; }
.stagebox canvas { display: block; width: 100%; }
.hud { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-top: 10px; }
.hud .col { display: flex; flex-direction: column; gap: 5px; }
.hud .col.mons { text-align: right; }
.unit { font-size: 13px; }
.unit .nm { display: flex; justify-content: space-between; gap: 6px; }
.unit .nm span { color: var(--muted); font-size: 12px; }
.unit .hp { height: 6px; background: rgba(0,0,0,.5); border-radius: 3px; overflow: hidden; margin-top: 2px; }
.unit .hp i { display: block; height: 100%; background: var(--good); transition: width .25s; }
.unit.low .hp i { background: #d68a2a; } .unit.out { opacity: .45; } .mons .unit .hp i { background: var(--curtain); }
.captions { margin-top: 10px; min-height: 92px; background: rgba(239,225,192,.05); border-left: 3px solid var(--brass); padding: 8px 12px; border-radius: 0 8px 8px 0; display: flex; flex-direction: column; gap: 4px; }
.captions p { margin: 0; font-family: var(--font-letter); font-size: 17px; line-height: 1.35; color: var(--muted); }
.captions p:first-child { color: var(--light); }
.captions p.twist { color: #f2c75a; }
.controls { display: flex; gap: 6px; margin-top: 10px; }
.controls button { flex: 1; min-height: 40px; background: rgba(0,0,0,.3); border: 1px solid rgba(214,165,74,.3); border-radius: 8px; color: var(--light); font-weight: 700; font-size: 14px; }
.controls button[aria-pressed="true"] { background: var(--brass); color: #2a1406; }
.intervene { position: absolute; inset: 0; background: rgba(15,10,8,.82); display: flex; flex-direction: column; justify-content: center; padding: 12px; gap: 8px; animation: rise .3s both; }
.intervene h3 { font-size: 24px; color: var(--brass); }
.intervene p { margin: 0 0 4px; font-size: 14px; color: var(--muted); }
.intervene .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.intervene button { background: var(--parch); color: var(--parch-ink); border: 0; border-radius: 6px; padding: 7px 8px; text-align: left; min-height: 52px; }
.intervene button b { display: block; font-size: 14px; }
.intervene button span { font-size: 12px; color: #6a5236; }
.intervene button:disabled { opacity: .5; }
.verdict { margin-top: 14px; position: relative; background: var(--parch); color: var(--parch-ink); border-radius: 4px; padding: 16px 14px 14px; box-shadow: 0 8px 18px rgba(0,0,0,.45); }
.verdict .stamp { position: static; display: inline-block; font-size: 30px; margin-bottom: 8px; transform: rotate(-4deg); animation-name: stampIn2; }
@keyframes stampIn2 { from { transform: scale(2.4) rotate(-20deg); opacity: 0; } to { transform: scale(1) rotate(-4deg); opacity: .9; } }
.stamp.win { color: #2f7a58; } .stamp.lose { color: #a8342e; } .stamp.extract { color: #8a6420; }
.verdict ul { margin: 6px 0 0; padding-left: 18px; font-size: 15px; }
.verdict li { margin: 3px 0; }

/* ---- ledger & evening ---- */
.ledger { background: var(--parch); color: var(--parch-ink); border-radius: 4px; padding: 14px; box-shadow: 0 8px 18px rgba(0,0,0,.45); font-size: 15px; }
.ledger h3 { font-size: 24px; margin-bottom: 6px; }
.ledger .row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px dotted rgba(42,29,20,.25); font-variant-numeric: tabular-nums; }
.ledger .row.total { border-bottom: 0; border-top: 2px solid #2a1d14; margin-top: 4px; font-weight: 800; font-size: 17px; }
.plus { color: #2f7a58; font-weight: 800; } .minus { color: #a8342e; font-weight: 800; }
.feed { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.feed .line { background: rgba(239,225,192,.05); border-radius: 6px; padding: 7px 10px; display: flex; gap: 8px; justify-content: space-between; }
.feed .line em { color: var(--muted); font-style: italic; }
.feed .line .num { color: #f2c75a; white-space: nowrap; }
.card { background: rgba(239,225,192,.07); border: 1px solid rgba(214,165,74,.25); border-radius: 10px; padding: 14px; }
.card.drama { background: var(--parch); color: var(--parch-ink); border: 0; box-shadow: 0 8px 18px rgba(0,0,0,.45); }
.card.drama p { font-family: var(--font-letter); font-size: 18px; margin: 0 0 12px; line-height: 1.4; }
.card.drama .choices { display: flex; flex-direction: column; gap: 8px; }
.card.drama .res { font-weight: 700; font-size: 15px; background: rgba(42,29,20,.08); padding: 8px 10px; border-radius: 6px; }
.recruit { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; }
.recruit img { width: 72px; height: 72px; border-radius: 8px; }
.news { margin: 0; padding-left: 18px; font-size: 15px; color: var(--light); }
.news li { margin: 4px 0; }
.news li.bad { color: #ff9a8a; } .news li.good { color: #9fdcbc; }
.warn { background: rgba(184,56,44,.18); border: 1px solid var(--bad); color: #ffb3a6; border-radius: 8px; padding: 10px 12px; font-weight: 700; font-size: 14px; }

/* ---- roster ---- */
.roster { display: grid; grid-template-columns: 1fr; gap: 10px; }
.hcard { display: grid; grid-template-columns: 64px 1fr; gap: 12px; background: rgba(239,225,192,.06); border: 1px solid rgba(214,165,74,.2); border-radius: 10px; padding: 10px; text-align: left; color: var(--light); width: 100%; }
.hcard img { width: 64px; height: 64px; border-radius: 8px; }
.hcard .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.hcard h3 { font-size: 22px; }
.hcard .sub { font-size: 13px; color: var(--muted); }
.st { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; white-space: nowrap; }

.bars .b { height: 6px; background: rgba(0,0,0,.45); border-radius: 3px; overflow: hidden; }
.bars .b i { display: block; height: 100%; }
.trait { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 4px; background: rgba(214,165,74,.15); color: #f2d9a0; margin: 4px 4px 0 0; }

.fac { background: rgba(239,225,192,.06); border: 1px solid rgba(214,165,74,.22); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.fac .top { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
.fac h3 { font-size: 22px; }
.fac .kind { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); }
.lv { display: flex; gap: 4px; margin-top: 4px; }
.lv i { width: 18px; height: 6px; border-radius: 2px; background: rgba(0,0,0,.45); border: 1px solid rgba(214,165,74,.3); }
.lv i.on { background: var(--brass); }
.fac p { margin: 6px 0; font-size: 14px; color: var(--muted); }
.fac .now { font-size: 14px; color: var(--light); font-style: italic; }
.fac .big { margin-top: 6px; width: 100%; }

/* ---- chronicle ---- */
.log { display: flex; flex-direction: column; gap: 6px; }
.log .e { font-size: 14px; padding: 6px 10px; border-left: 3px solid rgba(214,165,74,.3); background: rgba(239,225,192,.04); }
.log .e small { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
.log .e.good { border-color: var(--good); } .log .e.bad { border-color: var(--bad); } .log .e.big { border-color: var(--brass); font-weight: 700; }

/* ---- overlay / modal ---- */
#overlay { position: fixed; inset: 0; background: rgba(10,6,5,.78); z-index: 40; display: flex; align-items: flex-end; justify-content: center; animation: fade .2s both; }
#overlay[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }
.modal { width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; background: var(--parch); color: var(--parch-ink); border-radius: 14px 14px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); animation: slideUp .3s cubic-bezier(.2,.9,.3,1) both; }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } }
.modal h2 { font-size: 30px; color: #2a140e; }
.modal .lettertext { font-family: var(--font-letter); font-size: 18px; line-height: 1.5; white-space: pre-line; margin: 10px 0 16px; }
.modal .row2 { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: start; }
.modal .row2 img { width: 96px; height: 96px; border-radius: 10px; }
.modal .statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0; text-align: center; }
.modal .statgrid div { background: rgba(42,29,20,.07); border-radius: 6px; padding: 6px 2px; font-size: 12px; color: #6a5236; }
.modal .statgrid b { display: block; font-size: 18px; color: #2a1d14; font-variant-numeric: tabular-nums; }
.modal h4 { margin: 14px 0 4px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #6a5236; }
.modal ul { margin: 0; padding-left: 18px; font-size: 14px; }
.modal .trait { background: rgba(42,29,20,.1); color: #3a2a1c; }

.modal .st.ready { background: #2f7a58; color: #fff; } .modal .st.wounded { background: #b8742a; color: #fff; } .modal .st.dead, .modal .st.gone { background: #5a4a3a; color: #efe1c0; }

/* ---- title ---- */
.title { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 24px 0 40px; }
.title canvas { width: 100%; border-radius: 12px; box-shadow: 0 0 0 2px #4a2a1a, 0 0 0 5px #24140e, 0 16px 40px rgba(0,0,0,.6); }
.title h1 { font-size: clamp(44px, 13vw, 70px); color: var(--brass); line-height: .9; letter-spacing: -.01em; text-shadow: 0 3px 0 #5a1420; }
.title .tag2 { font-family: var(--font-letter); font-style: italic; font-size: 20px; color: var(--light); margin-top: 6px; }
.title .small { font-size: 14px; color: var(--muted); }
.title .btns { display: flex; flex-direction: column; gap: 10px; }

@keyframes pulse { 50% { opacity: .55; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
@media (min-width: 600px) { #main { padding-left: 20px; padding-right: 20px; } .roster { grid-template-columns: 1fr 1fr; } .hcard { grid-template-columns: 56px 1fr; } .hcard img { width: 56px; height: 56px; } }

/* ===================== RULES & SIMULATION (no DOM) ===================== */
const TH = 35; // acceptance threshold

function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function hrand(key) { return mulberry(hashStr(key))(); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pickH = (arr, key) => arr[Math.floor(hrand(key) * arr.length) % arr.length];
function fill(str, o) { return str.replace(/\{(\w+)\}/g, (m, k) => (o[k] !== undefined ? o[k] : m)).replace(/\b([aA]) (?=[AEIOU][a-z])/g, '$1n '); }
function an(word) { return /^[AEIOU]/i.test(word) ? 'an' : 'a'; }

/* RNG lives in state so saves are reproducible */
function R(S) { const f = mulberry(S.seed); const v = f(); S.seed = (S.seed + 0x9E3779B1 + Math.floor(v * 1e9)) >>> 0; return v; }

function rankIndex(renown) { let r = 0; RANKS.forEach((k, i) => { if (renown >= k.at) r = i; }); return r; }
function rankName(renown) { return RANKS[rankIndex(renown)].name; }

/* ---------- heroes ---------- */
function makeHero(S, def) {
  const h = {
    id: S.nextId++, name: def.name, cls: def.cls, traits: def.traits.slice(), fear: def.fear, bio: def.bio, look: Object.assign({}, def.look),
    lvl: 1, xp: 0, gear: 0, gold: 15 + Math.floor(R(S) * 30), morale: 55 + Math.floor(R(S) * 15), status: 'ready', wound: 0, hp: 0,
    rel: {}, st: { missions: 0, wins: 0, downs: 0, kills: 0, fled: 0, earned: 0 }, hist: [], joined: S.day
  };
  h.hp = heroMax(h);
  return h;
}
function heroMax(h) { return Math.round(CLASSES[h.cls].hp + (h.lvl - 1) * 9 + h.gear * 5); }
function heroAtk(h) { return CLASSES[h.cls].atk + (h.lvl - 1) * 1.4 + h.gear * 1.6; }
function heroDef(h) { return CLASSES[h.cls].def + (h.lvl - 1) * 0.6 + h.gear * 1.3; }

function byName(S, n) { return S.heroes.find(h => h.name === n); }
function relOf(h, other) { return h.rel[other.name] || null; }
function setRel(a, b, kind) {
  if (kind === 'crush') { a.rel[b.name] = 'crush'; return; }
  a.rel[b.name] = kind; b.rel[a.name] = kind;
}
function addXp(S, h, n, notes) {
  h.xp += n; let ups = 0;
  while (h.xp >= xpNeed(h)) { h.xp -= xpNeed(h); h.lvl++; ups++; }
  if (ups) { h.hp = Math.min(heroMax(h), h.hp + 9 * ups); if (notes) notes.push(`${h.name} reached level ${h.lvl}. Insufferable about it.`); }
  return ups;
}
function note(S, text, kind) { S.log.unshift({ day: S.day, text, kind: kind || 'info' }); if (S.log.length > 220) S.log.length = 220; }
function hist(h, S, text) { h.hist.unshift(`Day ${S.day}: ${text}`); if (h.hist.length > 12) h.hist.length = 12; }

/* ---------- new game ---------- */
function newGame(seed) {
  const S = {
    v: 2, seed: (seed || (Date.now() & 0xffffffff)) >>> 0, day: 1, gold: 300, renown: 0, phase: 'morning', nextId: 1, nextPid: 1,
    heroes: [], recruitsUsed: [], petitions: [], recent: [], hall: { tavern: 1, smithy: 1, yard: 0, infirmary: 0, board: 1 },
    log: [], flags: {}, stats: { wins: 0, losses: 0, deaths: 0, earned: 0, days: 0 }, debtNights: 0,
    today: null, missionIdx: 0, evening: null, won: false
  };
  START_HEROES.forEach(d => S.heroes.push(makeHero(S, d)));
  START_RELATIONS.forEach(([a, b, k]) => setRel(byName(S, a), byName(S, b), k));
  startDay(S);
  note(S, 'You inherit the guild. Nobody threw a party. Nobody showed up to the one you threw.', 'big');
  return S;
}

/* ---------- petitions ---------- */
function scoutCost(S, p) { return Math.round((8 + 5 * p.danger) * (1 - 0.2 * (S.hall.board - 1))); }
const POTION_PRICE = 10;
function cutGold(p) { return Math.round(p.offer * p.cutPct / 100); }

function startDay(S) {
  S.phase = 'morning';
  S.today = { posted: [], reactions: [], parties: {}, queue: [], results: [], speech: false, round: false, payouts: 0, costs: 0, income: 0 };
  S.missionIdx = 0; S.evening = null;
  const rank = rankIndex(S.renown);
  const n = 3 + S.hall.board;
  const cap = S.day === 1 ? 2 : S.day === 2 ? 3 : 5;
  let pool = PETITIONS.filter(p => !p.special && (p.minRank || 0) <= rank && p.danger <= cap && !S.recent.includes(p.id));
  if (pool.length < n) { S.recent = S.recent.slice(-4); pool = PETITIONS.filter(p => !p.special && (p.minRank || 0) <= rank && !S.recent.includes(p.id)); }
  // bias: early days avoid too many deadly jobs
  const chosen = [];
  if (S.flags.treasure) { chosen.push(PETITIONS.find(p => p.id === 'treasure')); S.flags.treasure = false; }
  let guard = 0;
  while (chosen.length < n && pool.length && guard++ < 200) {
    const p = pool[Math.floor(R(S) * pool.length)];
    const deadly = chosen.filter(c => c.danger >= 4).length;
    if (p.danger >= 4 && (deadly >= 1 || (S.day < 3 && R(S) < 0.6))) continue;
    if (!chosen.includes(p)) chosen.push(p);
  }
  S.petitions = chosen.map(t => makePetition(S, t));
  S.recent = S.recent.concat(chosen.map(c => c.id)).slice(-14);
}
function makePetition(S, t) {
  const rank = rankIndex(S.renown);
  const mult = (1 + 0.12 * (S.hall.board - 1)) * (1 + 0.07 * rank);
  const p = Object.assign({}, t, { uid: S.nextPid++, offer: Math.round(t.offer * mult / 5) * 5, status: 'new', cutPct: 60, potions: 0, downplay: false, scouted: false });
  p.actualThreat = t.threat; p.actualDanger = t.danger;
  if (t.twist && R(S) < t.twist.chance) { p.actualThreat = t.twist.threat; p.actualDanger = clamp(t.danger + t.twist.dd, 1, 5); }
  else { const r = R(S); if (r < 0.2) p.actualDanger = clamp(t.danger + 1, 1, 5); else if (r < 0.3) p.actualDanger = clamp(t.danger - 1, 1, 5); }
  return p;
}
function perceived(p) {
  const base = p.scouted ? { threat: p.actualThreat, danger: p.actualDanger } : { threat: p.threat, danger: p.danger };
  return { threat: base.threat, danger: Math.max(1, base.danger - (p.downplay ? 1 : 0)) };
}
function expectedSize(p) { return Math.max(1, Math.min(p.cap, perceived(p).danger)); }
function perHead(p) { return Math.round(cutGold(p) / expectedSize(p)); }

/* ---------- hero decisions ---------- */
function evaluate(S, h, p, partyNames) {
  const pv = perceived(p);
  const per = perHead(p);
  const fair = 18 + 14 * h.lvl;
  const parts = [];
  let pay = (per / fair - 1) * 50;
  if (has(h, 'Greedy')) pay *= pay > 0 ? 1.7 : 1.5;
  if (has(h, 'Arrogant') && pay < 0) pay *= 1.3;
  parts.push(['pay', pay]);
  let glory = p.renown * 1.6 * (has(h, 'Brave') ? 1.6 : 1) * (has(h, 'Arrogant') ? 1.2 : 1) * (has(h, 'Cowardly') ? 0.6 : 1);
  parts.push(['glory', glory]);
  const comfort = 1 + heroPower(h);
  let dm = 1;
  if (has(h, 'Cowardly')) dm = 2.0; if (has(h, 'Brave')) dm = Math.min(dm, 0.55); if (has(h, 'Reckless')) dm = Math.min(dm, 0.35); if (has(h, 'Lucky')) dm *= 0.85;
  parts.push(['danger', -(Math.max(0, pv.danger - comfort) * 22 * dm + pv.danger * 3)]);
  if (pv.threat === h.fear) parts.push(['fear', has(h, 'Brave') ? -40 : -58]);
  if (has(h, 'Lazy')) parts.push(['lazy', -(12 + (p.type === 'Explore' ? 8 : 0) + pv.danger * 2)]);
  if (has(h, 'Arrogant') && pv.danger <= 2 && p.renown < 8) parts.push(['arrogant', -16]);
  if (p.perk === 'flirty' && has(h, 'Romantic')) parts.push(['flirty', 18]);
  if (p.perk === 'booze' && has(h, 'Drunkard')) parts.push(['booze', 22]);
  if ((p.perk === 'undead' || MONSTERS[pv.threat].undead) && has(h, 'Pious')) parts.push(['undead', 18]);
  if ((p.perk === 'mystery' || p.type === 'Explore') && has(h, 'Curious')) parts.push(['curious', p.perk === 'mystery' ? 17 : 8]);
  parts.push(['morale', (h.morale - 55) * 0.35]);
  const r = h.hp / heroMax(h);
  if (r < 0.75) parts.push(['hurt', -(0.75 - r) * 90]);
  (partyNames || []).forEach(n => {
    const k = h.rel[n];
    if (k === 'rival') parts.push(['rival', -75, n]);
    if (k === 'crush') parts.push(['crush', 24, n]);
    if (k === 'friend') parts.push(['friend', has(h, 'Loyal') ? 20 : 12, n]);
  });
  const noise = (hrand(`${S.day}|${h.id}|${p.uid}`) - 0.5) * 14;
  const score = 32 + noise + parts.reduce((a, b) => a + b[1], 0);
  return { score, parts, per, pv };
}
function mood(score) { return score >= 58 ? 'eager' : score >= TH ? 'yes' : score >= 22 ? 'maybe' : 'no'; }

function reasonKey(ev, accepted) {
  const parts = ev.parts.slice();
  if (accepted) {
    const pos = parts.filter(x => x[1] > 0 && x[0] !== 'morale').sort((a, b) => b[1] - a[1]);
    const top = pos[0];
    if (!top || top[1] < 7) return { key: 'general' };
    const map = { pay: 'pay', glory: 'glory', flirty: 'flirty', booze: 'booze', undead: 'undead', curious: 'curious', crush: 'crush', friend: 'friend' };
    return { key: map[top[0]] || 'general', who: top[2] };
  }
  const neg = parts.filter(x => x[1] < 0).sort((a, b) => a[1] - b[1]);
  const top = neg[0];
  if (!top || top[1] > -8) return { key: 'refuse' };
  const map = { pay: 'lowpay', danger: 'danger', fear: 'fear', lazy: 'lazy', arrogant: 'arrogant', hurt: 'hurt', morale: 'morale', rival: 'rival' };
  return { key: map[top[0]] || 'refuse', who: top[2] };
}
function quipFor(S, h, p, ev, accepted) {
  const rk = reasonKey(ev, accepted);
  const own = HERO_QUIPS[h.name] && HERO_QUIPS[h.name][rk.key];
  const pool = own && hrand(`own${S.day}${h.id}${rk.key}`) < 0.7 ? own : (QUIPS[rk.key] || QUIPS.general);
  const text = fill(pickH(pool, `${S.day}|${h.id}|${p ? p.uid : 0}|${rk.key}`), {
    gold: ev.per, threat: ev.pv.threat, client: p ? p.client : '', crush: rk.who || '', rival: rk.who || '', friend: rk.who || ''
  });
  return { key: rk.key, text };
}

function readyHeroes(S) { return S.heroes.filter(h => h.status === 'ready'); }
function formParties(S) {
  const posted = S.petitions.filter(p => p.status === 'posted');
  const heroes = readyHeroes(S);
  const parties = {}; posted.forEach(p => { parties[p.uid] = []; });
  const assigned = new Map();
  const pairs = [];
  heroes.forEach(h => posted.forEach(p => { const ev = evaluate(S, h, p, []); if (ev.score >= TH) pairs.push({ h, p, ev }); }));
  pairs.sort((a, b) => b.ev.score - a.ev.score);
  const blocked = {};
  pairs.forEach(({ h, p, ev }) => {
    if (assigned.has(h.id)) return;
    const party = parties[p.uid];
    if (party.length >= p.cap) return;
    const rival = party.find(o => h.rel[o.name] === 'rival');
    if (rival) { blocked[h.id] = { p, rival }; return; }
    party.push(h); assigned.set(h.id, { p, ev });
  });
  // second pass: crushes and friends tag along
  heroes.forEach(h => {
    if (assigned.has(h.id)) return;
    let best = null;
    posted.forEach(p => {
      const party = parties[p.uid];
      if (party.length >= p.cap || party.length === 0) return;
      const ev = evaluate(S, h, p, party.map(o => o.name));
      if (ev.score >= TH && (!best || ev.score > best.ev.score)) best = { p, ev };
    });
    if (best) { parties[best.p.uid].push(h); assigned.set(h.id, best); }
  });
  const reactions = heroes.map(h => {
    const a = assigned.get(h.id);
    if (a) {
      const party = parties[a.p.uid].filter(o => o !== h).map(o => o.name);
      const ev = evaluate(S, h, a.p, party);
      return Object.assign({ hid: h.id, pid: a.p.uid, ok: true, score: ev.score }, quipFor(S, h, a.p, ev, true));
    }
    let best = null;
    posted.forEach(p => { const ev = evaluate(S, h, p, parties[p.uid].map(o => o.name)); if (!best || ev.score > best.ev.score) best = { p, ev }; });
    if (!best) return { hid: h.id, pid: null, ok: false, key: 'refuse', text: 'Nothing posted. Back to the tavern.', score: 0 };
    return Object.assign({ hid: h.id, pid: best.p.uid, ok: false, score: best.ev.score }, quipFor(S, h, best.p, best.ev, false));
  });
  const out = {}; Object.keys(parties).forEach(k => { out[k] = parties[k].map(h => h.id); });
  return { parties: out, reactions };
}

/* ---------- missions ---------- */
function buildEncounter(threat, danger, rank) {
  const m = MONSTERS[threat];
  const budget = (55 * Math.pow(danger, 1.4) + 10) * (1 + 0.14 * (rank || 0));
  const count = clamp(Math.round(budget / m.power), 1, m.max);
  const mult = budget / (count * m.power);
  const out = [];
  for (let i = 0; i < count; i++) {
    const hp = Math.round(m.hp * Math.pow(mult, 0.8));
    out.push({ key: 'm' + i, kind: threat, name: threat, hp, maxhp: hp, atk: m.atk * Math.pow(mult, 0.6), def: m.def, alive: true, reassembled: false, chicken: false });
  }
  return out;
}
function startMission(S, p, partyIds) {
  const heroes = partyIds.map(id => S.heroes.find(h => h.id === id)).map(h => ({
    key: 'h' + h.id, id: h.id, name: h.name, cls: h.cls, traits: h.traits, fear: h.fear, lvl: h.lvl, gear: h.gear,
    hp: h.hp, maxhp: heroMax(h), atk: heroAtk(h), def: heroDef(h), down: false, fled: false, stuck: 0, charmed: 0, buff: 1, kills: 0
  }));
  const M = { pid: p.uid, heroes, mons: buildEncounter(p.actualThreat, p.actualDanger, rankIndex(S.renown)), potions: p.potions, round: 0, done: false, result: null,
    intervened: false, pending: false, danger: p.actualDanger, threat: p.actualThreat, stolen: {}, started: false };
  return M;
}
const standing = M => M.heroes.filter(h => !h.down && !h.fled);
const ratio = u => u.hp / u.maxhp;
const hasT = (u, t) => u.traits && u.traits.includes(t);

function dmgRoll(S, atk, def, mult) { return Math.max(1, Math.round(atk * (0.82 + R(S) * 0.42) * mult - def * 0.6)); }

function stepMission(S, M, p) {
  const ev = [];
  const party = M.heroes.map(h => h.name).join(', ').replace(/, ([^,]*)$/, ' and $1');
  if (!M.started) {
    M.started = true;
    ev.push({ t: 'cap', text: fill(rpick(S, NARR.open), { party }) });
    if (!p.scouted && (p.actualThreat !== p.threat)) ev.push({ t: 'cap', text: fill(rpick(S, NARR.twist), { claimed: p.threat, actual: p.actualThreat, an: an(p.actualThreat) }), twist: true });
    else if (!p.scouted && p.actualDanger > p.danger) ev.push({ t: 'cap', text: `There are more ${MONSTERS[p.actualThreat].plural.toLowerCase()} than advertised. Clients always round down.`, twist: true });
    if (M.threat === 'Mimic') {
      const tgt = rpick(S, standing(M)); const m = M.mons[0];
      const d = dmgRoll(S, m.atk, tgt.def, 1.5); tgt.hp = Math.max(0, tgt.hp - d);
      ev.push({ t: 'cap', text: NARR.ambush[0] });
      ev.push({ t: 'hit', src: m.key, dst: tgt.key, n: d, hp: tgt.hp, style: 'melee' });
      if (tgt.hp <= 0) { tgt.down = true; ev.push({ t: 'down', who: tgt.key, text: fill(rpick(S, NARR.down), { a: tgt.name }) }); }
    }
    return ev;
  }
  M.round++;
  const R3 = M.round % 3;
  // heroes act
  for (const h of M.heroes) {
    if (M.done) break;
    if (h.down || h.fled) continue;
    const foes = M.mons.filter(m => m.alive);
    if (!foes.length) break;
    if (h.charmed > 0) { h.charmed--; ev.push({ t: 'cap', text: `${h.name} is still under the siren's spell, humming a love song at nobody.` }); continue; }
    if (h.stuck > 0) { h.stuck--; ev.push({ t: 'cap', text: `${h.name} is stuck in the slime. It's squelching. Loudly.` }); continue; }
    if (M.round === 1 && M.threat === h.fear && R(S) < 0.6) { ev.push({ t: 'freeze', who: h.key, text: fill(NARR.freeze[0], { a: h.name, b: M.threat.toLowerCase() }) }); continue; }
    const rr = ratio(h);
    const th = hasT(h, 'Cowardly') ? 0.45 : hasT(h, 'Reckless') ? 0 : hasT(h, 'Brave') ? 0.12 : 0.25;
    if (rr < th && R(S) < (hasT(h, 'Cowardly') ? 0.7 : 0.45)) { h.fled = true; ev.push({ t: 'flee', who: h.key, text: fill(rpick(S, NARR.flee), { a: h.name }) }); continue; }
    if (rr < 0.35 && M.potions > 0) { M.potions--; const n = Math.round(h.maxhp * 0.45); h.hp = Math.min(h.maxhp, h.hp + n); ev.push({ t: 'heal', src: h.key, dst: h.key, n, hp: h.hp, potion: true, text: fill(NARR.potion[0], { a: h.name, n }) }); continue; }
    if (h.cls === 'Cleric') {
      const hurt = standing(M).filter(o => ratio(o) < 0.6).sort((a, b) => ratio(a) - ratio(b))[0];
      if (hurt) {
        const n = Math.round(16 + 3 * h.lvl + h.gear * 2 + R(S) * 6);
        hurt.hp = Math.min(hurt.maxhp, hurt.hp + n);
        const pool = h.name === 'Brother Vale' ? NARR.valeHeal : NARR.heal;
        ev.push({ t: 'heal', src: h.key, dst: hurt.key, n, hp: hurt.hp, text: fill(rpick(S, pool), { a: h.name, b: hurt === h ? 'themself' : hurt.name, n }) });
        continue;
      }
    }
    let tgt = R(S) < 0.5 ? foes.slice().sort((a, b) => a.hp - b.hp)[0] : rpick(S, foes);
    if (R(S) < (hasT(h, 'Lucky') ? 0.03 : 0.07)) { ev.push({ t: 'miss', src: h.key, dst: tgt.key, style: styleOf(h), text: fill(rpick(S, NARR.miss), { a: h.name, b: tgt.name.toLowerCase() }) }); continue; }
    if (hasT(h, 'Drunkard') && R(S) < 0.15) { ev.push({ t: 'cap', text: fill(NARR.drunk[0], { a: h.name }) }); h.buff = Math.min(1.6, h.buff + 0.15); }
    if (h.cls === 'Wizard' && R(S) < Math.max(0.03, 0.1 - 0.012 * h.lvl)) {
      if (!MONSTERS[tgt.kind].boss && R(S) < 0.4) {
        tgt.alive = false; tgt.chicken = true; h.kills++;
        ev.push({ t: 'chicken', src: h.key, dst: tgt.key, text: fill(NARR.chicken[0], { a: h.name, b: tgt.name.toLowerCase() }) });
      } else {
        const victim = rpick(S, standing(M)); const d = Math.round(h.atk * 0.55);
        victim.hp = Math.max(0, victim.hp - d);
        ev.push({ t: 'hit', src: h.key, dst: victim.key, n: d, hp: victim.hp, style: 'magic', oops: true, text: fill(NARR.mishap[0], { a: h.name, b: victim.name, n: d }) });
        if (victim.hp <= 0) { victim.down = true; ev.push({ t: 'down', who: victim.key, text: fill(rpick(S, NARR.down), { a: victim.name }) }); }
      }
      continue;
    }
    const style = styleOf(h);
    let mult = h.buff, crit = false;
    if (h.cls === 'Rogue' && R(S) < 0.22 + (hasT(h, 'Lucky') ? 0.1 : 0)) { mult *= 2.1; crit = true; }
    if (h.cls === 'Wizard') mult *= 1.15;
    if (h.cls === 'Cleric') mult *= MONSTERS[tgt.kind].undead ? 1.6 : 0.9;
    if (MONSTERS[tgt.kind].ethereal && style !== 'magic') mult *= 0.55;
    const hits = (h.cls === 'Wizard' && R3 === 0) ? foes : [tgt];
    const twice = h.cls === 'Ranger' && R(S) < 0.12;
    for (const t of hits) {
      for (let k = 0; k < (twice ? 2 : 1); k++) {
        if (!t.alive) continue;
        const d = dmgRoll(S, h.atk, t.def, mult * (hits.length > 1 ? 0.7 : 1));
        t.hp = Math.max(0, t.hp - d);
        const pool = crit ? NARR.rogueCrit : style === 'ranged' ? NARR.rangedHit : style === 'magic' ? (h.cls === 'Cleric' ? NARR.smite : NARR.magicHit) : NARR.meleeHit;
        ev.push({ t: 'hit', src: h.key, dst: t.key, n: d, hp: t.hp, style, crit, aoe: hits.length > 1, text: hits.length > 1 ? (t === hits[0] ? `${h.name} unleashes a blast that hits everything. Including some scenery.` : null) : fill(rpick(S, pool), { a: h.name, b: t.name.toLowerCase(), n: d }) });
        if (t.hp <= 0) {
          if (t.kind === 'Skeleton' && !t.reassembled && R(S) < 0.3) { t.reassembled = true; t.hp = Math.round(t.maxhp * 0.35); ev.push({ t: 'revive', who: t.key, hp: t.hp, text: NARR.reassemble[0] }); }
          else { t.alive = false; h.kills++; ev.push({ t: 'die', who: t.key, text: fill(rpick(S, NARR.monDie), { b: t.name.toLowerCase() }) }); }
        }
      }
    }
  }
  // monsters act
  for (const m of M.mons) {
    if (!m.alive) continue;
    const targets = standing(M);
    if (!targets.length) break;
    const mk = MONSTERS[m.kind];
    if (m.kind === 'Dragon' && R3 === 0) {
      const list = targets.map(t => { const d = dmgRoll(S, m.atk * 0.6, t.def, 1); t.hp = Math.max(0, t.hp - d); return { dst: t.key, n: d, hp: t.hp }; });
      ev.push({ t: 'breath', src: m.key, list, text: NARR.breath[0] });
      targets.forEach(t => { if (t.hp <= 0) { t.down = true; ev.push({ t: 'down', who: t.key, text: fill(rpick(S, NARR.down), { a: t.name }) }); } });
      continue;
    }
    const war = targets.find(t => t.cls === 'Warrior');
    const tgt = war && R(S) < 0.55 ? war : rpick(S, targets);
    let mult = 1, text = null, extra = null;
    if (m.kind === 'Ogre' && R3 === 2) { mult = 1.8; text = rpick(S, NARR.ogreSmash); }
    if (mk.special === 'steal' && R(S) < 0.2) { const n = 5 + Math.floor(R(S) * 12); M.stolen[tgt.id] = (M.stolen[tgt.id] || 0) + n; extra = { t: 'cap', text: fill(NARR.steal[0], { b: tgt.name, n }) }; mult = 0.6; }
    if (mk.special === 'spook' && R(S) < 0.22) {
      ev.push({ t: 'spook', src: m.key, dst: tgt.key, text: fill(NARR.spook[0], { b: tgt.name }) });
      if (!hasT(tgt, 'Brave') && !hasT(tgt, 'Pious') && R(S) < (hasT(tgt, 'Cowardly') ? 0.85 : 0.4)) { tgt.fled = true; ev.push({ t: 'flee', who: tgt.key, text: fill(rpick(S, NARR.flee), { a: tgt.name }) }); }
      continue;
    }
    if (mk.special === 'engulf' && R(S) < 0.2) { tgt.stuck = 1; mult = 1.2; text = fill(rpick(S, NARR.engulf), { b: tgt.name }); }
    if (mk.special === 'charm' && R(S) < (hasT(tgt, 'Romantic') ? 0.5 : hasT(tgt, 'Pious') ? 0.08 : 0.25)) {
      tgt.charmed = 1; ev.push({ t: 'charm', src: m.key, dst: tgt.key, text: fill(rpick(S, NARR.charm), { b: tgt.name }) }); continue;
    }
    const d = dmgRoll(S, m.atk, tgt.def, mult);
    tgt.hp = Math.max(0, tgt.hp - d);
    ev.push({ t: 'hit', src: m.key, dst: tgt.key, n: d, hp: tgt.hp, style: 'melee', mon: true, text: text ? fill(text, { b: tgt.name, n: d }) : fill(rpick(S, (NARR.by[m.kind] && R(S) < 0.6) ? NARR.by[m.kind] : NARR.monHit), { a: m.name.toLowerCase(), b: tgt.name, n: d }) });
    if (extra) ev.push(extra);
    if (d > tgt.maxhp * 0.16 && tgt.hp > 0 && R(S) < 0.35) ev.push({ t: 'bark', who: tgt.key, text: rpick(S, (BARKS[tgt.name] && R(S) < 0.4) ? BARKS[tgt.name] : BARKS.hurt) });
    if (tgt.hp <= 0) { tgt.down = true; ev.push({ t: 'down', who: tgt.key, text: fill(rpick(S, NARR.down), { a: tgt.name }) }); }

}
function styleOf(h) { return h.cls === 'Ranger' ? 'ranged' : (h.cls === 'Wizard' || h.cls === 'Cleric') ? 'magic' : 'melee'; }
function checkEnd(S, M, ev) {
  const party = M.heroes.filter(h => !h.fled).map(h => h.name).join(', ') || 'Nobody';
  if (M.mons.every(m => !m.alive)) { M.done = true; M.result = 'win'; ev.push({ t: 'end', result: 'win', text: fill(rpick(S, NARR.win), { party }) }); }
  else if (!standing(M).length) { M.done = true; M.result = 'lose'; ev.push({ t: 'end', result: 'lose', text: rpick(S, NARR.lose) }); }
  else if (M.round >= 14) { M.done = true; M.result = 'lose'; ev.push({ t: 'end', result: 'lose', text: NARR.stalemate[0] }); }
}

function interventionCosts(M) { return { pigeon: 12 + 6 * M.danger, teleport: 15 + 7 * M.danger }; }
function intervene(S, M, choice) {
  M.intervened = true; M.pending = false;
  const c = interventionCosts(M); const ev = [];
  if (choice === 'pigeon') {
    S.gold -= c.pigeon; S.today.costs += c.pigeon;
    ev.push({ t: 'cap', text: 'A pigeon arrives carrying potions and an attitude. It drops them on everyone. Mostly on their heads.' });
    M.heroes.forEach(h => {
      if (h.fled) return;
      if (h.down) { h.down = false; h.hp = Math.round(h.maxhp * 0.25); ev.push({ t: 'revive', who: h.key, hp: h.hp, text: `${h.name} gets back up, smelling of pigeon.` }); }
      else { const n = Math.round(h.maxhp * 0.35); h.hp = Math.min(h.maxhp, h.hp + n); ev.push({ t: 'heal', src: h.key, dst: h.key, n, hp: h.hp, potion: true }); }
    });
  } else if (choice === 'teleport') {
    S.gold -= c.teleport; S.today.costs += c.teleport;
    M.done = true; M.result = 'extract';
    ev.push({ t: 'cap', text: 'The teleport scroll works! Everyone lands in the guild hall. One of them lands in the soup.' });
    ev.push({ t: 'end', result: 'extract', text: 'Mission abandoned. Bodies intact. Pride less so.' });
  } else if (choice === 'speech') {
    if (R(S) < 0.55) {
      standing(M).forEach(h => { h.buff = Math.min(1.8, h.buff + 0.3); });
      ev.push({ t: 'cap', text: "You bellow something inspiring from the back row. Nobody heard the words, but the tone was perfect. Everyone hits harder." });
      standing(M).forEach(h => ev.push({ t: 'bark', who: h.key, text: rpick(S, ['FOR THE GUILD!', "What'd they say?", 'YEAH! ...Yeah?', 'Inspired! Probably!']) }));
    } else {
      const coward = standing(M).sort((a, b) => (hasT(b, 'Cowardly') ? 1 : 0) - (hasT(a, 'Cowardly') ? 1 : 0))[0];
      ev.push({ t: 'cap', text: `You yell "DON'T RETREAT!" ${coward ? coward.name + ' only hears the last word.' : ''}` });
      if (coward) { coward.fled = true; ev.push({ t: 'flee', who: coward.key, text: `${coward.name} retreats, as instructed. Sort of.` }); }
    }
  } else {
    if (R(S) < 0.12) { standing(M).forEach(h => { h.buff = Math.min(1.8, h.buff + 0.15); }); ev.push({ t: 'cap', text: 'You pour a drink and stare. Your silent judgment somehow inspires them.' }); }
    else ev.push({ t: 'cap', text: 'You pour yourself a drink and watch. Bravely. From a great distance.' });

}

function autoResolve(S, M, p, events) {
  let guard = 0;
  while (!M.done && guard++ < 40) { const ev = stepMission(S, M, p); if (events) events.push(...ev); if (M.pending) M.pending = false, M.intervened = true; }
}

const LOOT = ['a jewelled goblet', "a duke's monogrammed undergarments", 'a cursed (but valuable) spoon', 'a sack of teeth (gold ones)', 'a small painting of a large horse', 'a love letter worth blackmail money', 'an ornate helmet with a mouse living in it'];

function settleMission(S, p, M) {
  const party = M.heroes.map(mh => ({ mh, h: S.heroes.find(h => h.id === mh.id) }));
  const out = { pid: p.uid, title: p.title, client: p.client, result: M.result, lines: [], payout: 0, net: 0, renown: 0, deaths: [], wounded: [], ups: [] };
  const notes = [];
  party.forEach(({ mh, h }) => { h.hp = Math.max(0, Math.round(mh.hp)); h.st.missions++; });
  const stay = party.filter(x => !x.mh.fled);
  const fled = party.filter(x => x.mh.fled);
  const lied = p.downplay && p.actualDanger >= p.danger;
  if (M.result === 'win') {
    const cut = cutGold(p);
    S.gold += p.offer; S.today.income += p.offer;
    const recips = stay.length ? stay : party;
    const share = Math.floor(cut / recips.length);
    recips.forEach(({ h }) => { h.gold += share; h.st.earned += share; h.st.wins++; });
    S.gold -= share * recips.length; S.today.payouts += share * recips.length;
    out.payout = share * recips.length; out.net = p.offer - out.payout;
    S.renown += p.renown; out.renown = p.renown; S.stats.wins++; S.stats.earned += out.net;
    out.lines.push(`${p.client} pays ${p.offer}g. Heroes take ${out.payout}g (${share}g each). The guild keeps ${out.net}g.`);
    if (fled.length) out.lines.push(`${fled.map(x => x.h.name).join(' and ')} fled, so their share went to the people who stayed. Cowards' tax.`);
    if (R(S) < 0.25) {
      const v = Math.round((10 + R(S) * 30) * p.actualDanger / 2) * 2;
      const item = rpick(S, LOOT); const each = Math.floor(v / recips.length);
      recips.forEach(({ h }) => { h.gold += each; });
      out.lines.push(`They also found ${item} and sold it for ${v}g. The guild was not consulted.`);
    }
    stay.forEach(({ mh, h }) => { addXp(S, h, 15 * p.actualDanger + 4 * mh.kills, notes); h.morale = clamp(h.morale + 12, 0, 100); h.st.kills += mh.kills; hist(h, S, `Won "${p.title}".`); });
    fled.forEach(({ h }) => { addXp(S, h, 6, notes); h.morale = clamp(h.morale - 8, 0, 100); h.st.fled++; hist(h, S, `Fled from "${p.title}". The others won't let it go.`); });
    if (p.downplay && p.actualDanger > p.danger - 1) { stay.forEach(({ h }) => { h.morale = clamp(h.morale - 6, 0, 100); }); out.lines.push('They noticed you downplayed the danger. They won anyway, but they noticed.'); }
  } else {
    S.stats.losses++;
    const loss = M.result === 'extract' ? 1 : Math.ceil(p.renown / 3);
    S.renown = Math.max(0, S.renown - loss); out.renown = -loss;
    out.lines.push(M.result === 'extract' ? `Mission abandoned. ${p.client} is "disappointed but not surprised".` : `Failed. ${p.client} pays nothing and tells everyone at the market.`);
    party.forEach(({ mh, h }) => { addXp(S, h, 8 * p.actualDanger, notes); h.morale = clamp(h.morale - 10, 0, 100); if (mh.fled) h.st.fled++; hist(h, S, `Failed "${p.title}".`); });
    if (lied) { party.forEach(({ h }) => { h.morale = clamp(h.morale - 12, 0, 100); }); S.renown = Math.max(0, S.renown - 2); out.renown -= 2; out.lines.push('Word gets out that you downplayed the danger. The heroes are livid. So are the bards.'); }
  }
  // stolen gold
  party.forEach(({ h }) => { const n = M.stolen[h.id]; if (n) h.gold = Math.max(0, h.gold - n); });
  // the fallen
  const clericUp = M.heroes.some(x => x.cls === 'Cleric' && !x.down && !x.fled);
  party.forEach(({ mh, h }) => {
    if (mh.down) {
      h.st.downs++;
      let dc = 0.08 + 0.045 * p.actualDanger - (clericUp ? 0.08 : 0) - (has(h, 'Lucky') ? 0.12 : 0);
      if (M.result === 'extract') dc = 0;
      dc = M.result === 'extract' ? 0 : clamp(dc, 0.02, 0.3);
      if (R(S) < dc) {
        h.status = 'dead'; h.hp = 0; out.deaths.push(h.name); S.stats.deaths++;
        hist(h, S, `Died on "${p.title}".`);
        note(S, `${h.name} died on "${p.title}". The guild hangs a slightly crooked portrait.`, 'bad');
        alive(S).forEach(o => { o.morale = clamp(o.morale - (o.rel[h.name] ? 20 : 6), 0, 100); });
      } else {
        h.status = 'wounded'; h.wound = Math.max(1, 1 + (p.actualDanger >= 4 ? 1 : 0) + (R(S) < 0.4 ? 1 : 0) - (S.hall.infirmary >= 2 ? 1 : 0));
        h.hp = Math.max(h.hp, Math.round(heroMax(h) * 0.1)); out.wounded.push(`${h.name} (${h.wound}d)`);
      }
    } else if (h.hp < heroMax(h) * 0.25) { h.status = 'wounded'; h.wound = 1; out.wounded.push(`${h.name} (1d)`); }
  });
  out.ups = notes;
  note(S, `${M.result === 'win' ? 'Success' : M.result === 'extract' ? 'Abandoned' : 'Failure'}: "${p.title}" with ${party.map(x => x.h.name).join(', ')}.`, M.result === 'win' ? 'good' : 'bad');
  p.status = 'done';
  return out;
}

/* ---------- evening ---------- */
const PRICES = { tavern: 8, infirmary: 14, yard: 18 };
function gearPrice(h) { return 35 + 22 * h.gear; }
function margin(S, key, price) { return Math.round(price * (0.3 + 0.1 * S.hall[key])); }
const SPEND_QUIPS = {
  tavern: ['Mostly on "communion".', 'Sang. Was asked to stop. Sang louder.', 'Tipped generously. Flirted worse.', 'Started a fight with a coat rack. Won.', 'Drank to forget. Forgot why.'],
  smithy: ['Bought a bigger sword. Compensating, probably.', 'New armour. Very shiny. Squeaks.', 'Had the blade sharpened and the ego polished.'],
  yard: ['Beat up a dummy. The dummy will remember.', 'Practised a heroic pose for an hour.', 'Sparred. Lost to a scarecrow. Learned humility. Briefly.'],
  infirmary: ['The nun said "hold still" eleven times.', 'Stitched up. Complained throughout.', 'Got a lollipop. Did not deserve it.']
};
function upkeep(S) { const lv = Object.values(S.hall).reduce((a, b) => a + b, 0); return 15 + 5 * alive(S).length + 5 * lv - (S.flags.broom > 0 ? 8 : 0); }

function runEvening(S) {
  const E = { hall: [], hallIncome: 0, upkeep: 0, notes: [], leavers: [], event: null, recruit: null, eventDone: false };
  const onMission = new Set();
  Object.values(S.today.parties || {}).forEach(ids => ids.forEach(id => onMission.add(id)));
  alive(S).forEach(h => {
    if (h.status === 'wounded') { h.wound--; h.hp = Math.min(heroMax(h), h.hp + Math.round(heroMax(h) * (0.2 + 0.08 * S.hall.infirmary))); if (h.wound <= 0) { h.status = 'ready'; h.hp = Math.max(h.hp, Math.round(heroMax(h) * 0.55)); } }
    else if (!onMission.has(h.id)) { h.hp = Math.min(heroMax(h), h.hp + Math.round(heroMax(h) * 0.3)); h.morale += (55 - h.morale) * 0.25; if (has(h, 'Lazy')) h.morale += 4; }
    else { h.hp = Math.min(heroMax(h), h.hp + Math.round(heroMax(h) * 0.12)); }
  });
  // shopping
  alive(S).forEach(h => {
    let buys = 0;
    const spend = (key, price, label) => {
      h.gold -= price; const m = margin(S, key, price); S.gold += m; E.hallIncome += m; buys++;
      E.hall.push({ who: h.name, where: FACILITIES[key].name, price, cut: m, text: label || rpick(S, SPEND_QUIPS[key]) });
    };
    const thrifty = has(h, 'Greedy') && h.gold < 90;
    if (S.hall.infirmary > 0 && (h.status === 'wounded' || h.hp < heroMax(h) * 0.6) && h.gold >= PRICES.infirmary) {
      spend('infirmary', PRICES.infirmary); h.hp = Math.min(heroMax(h), h.hp + Math.round(heroMax(h) * 0.4));
      if (h.status === 'wounded' && --h.wound <= 0) { h.status = 'ready'; }
    }
    if (S.hall.tavern > 0 && h.gold >= PRICES.tavern && (has(h, 'Drunkard') || has(h, 'Lazy') || h.morale < 50 || R(S) < 0.35) && !(thrifty && !has(h, 'Drunkard'))) {
      spend('tavern', PRICES.tavern); h.morale = clamp(h.morale + 10 + 5 * S.hall.tavern, 0, 100); h.hp = Math.min(heroMax(h), h.hp + Math.round(heroMax(h) * 0.06));
      if (has(h, 'Drunkard') && h.gold >= PRICES.tavern && R(S) < 0.5) { spend('tavern', PRICES.tavern, 'Went back for seconds. And thirds. Was carried home.'); }
    }
    if (buys < 2 && S.hall.smithy > 0 && h.gear < S.hall.smithy * 2 && h.gold >= gearPrice(h) + (thrifty ? 999 : 5) && (has(h, 'Brave') || has(h, 'Reckless') || has(h, 'Arrogant') || R(S) < 0.55)) {
      spend('smithy', gearPrice(h)); h.gear++; h.hp = Math.min(heroMax(h), h.hp + 5);
    }
    if (buys < 2 && S.hall.yard > 0 && h.gold >= PRICES.yard && !thrifty && (has(h, 'Curious') || R(S) < 0.4) && !has(h, 'Lazy')) {
      spend('yard', PRICES.yard); addXp(S, h, 22 * S.hall.yard, E.notes);
    }
  });
  // morale fallout and departures
  alive(S).forEach(h => {
    h.morale = clamp(Math.round(h.morale), 0, 100);
    if (h.morale < 15 && h.status === 'ready' && R(S) < 0.35) {
      h.status = 'gone'; E.leavers.push(`${h.name} quit. Left a note: "It's not me, it's you." It's you.`);
      note(S, `${h.name} quit the guild in a huff.`, 'bad');
    } else if (h.gold > 420 && h.lvl >= 4 && R(S) < 0.2) {
      h.status = 'gone'; E.leavers.push(`${h.name} retired rich and bought a farm. An actual farm. Sends you a goat.`);
      note(S, `${h.name} retired rich. Good for them. Bad for you.`, 'info');
    }
  });
  E.upkeep = upkeep(S);
  S.gold -= E.upkeep;
  if (S.flags.broom > 0) S.flags.broom--;
  if (typeof pickEvent === 'function' && R(S) < 0.55) E.event = pickEvent(S);
  const avail = RECRUITS.filter(r => !S.recruitsUsed.includes(r.name));
  if (avail.length && (alive(S).length < 7 || R(S) < 0.22)) {
    const r = rpick(S, avail);
    E.recruit = { def: r, fee: 50 + Math.floor(R(S) * 50) + 10 * rankIndex(S.renown) };
  }
  S.evening = E;
  return E;
}
function hireRecruit(S) {
  const E = S.evening; if (!E || !E.recruit) return null;
  const { def, fee } = E.recruit;
  if (S.gold < fee) return null;
  S.gold -= fee; S.recruitsUsed.push(def.name);
  const h = makeHero(S, def); h.lvl = Math.max(1, Math.min(4, 1 + rankIndex(S.renown))); h.hp = heroMax(h);
  S.heroes.push(h); E.recruit = null;
  note(S, `Hired ${h.name} the ${h.cls}. ${def.bio}`, 'good');
  return h;
}
function passRecruit(S) { if (S.evening && S.evening.recruit) { S.recruitsUsed.push(S.evening.recruit.def.name); S.evening.recruit = null; } }

function upgradeCost(S, key) { const n = S.hall[key] + 1; return Math.round(FACILITIES[key].base * Math.pow(n, 1.5) / 5) * 5; }
function canUpgrade(S, key) { return S.hall[key] < FACILITIES[key].max && S.gold >= upgradeCost(S, key); }
function upgrade(S, key) {
  if (!canUpgrade(S, key)) return false;
  S.gold -= upgradeCost(S, key); S.hall[key]++;
  note(S, `Upgraded ${FACILITIES[key].name} to "${FACILITIES[key].lvl[S.hall[key]]}".`, 'good');
  return true;
}
function resurrectCost(h) { return 140 + 40 * h.lvl; }
function resurrect(S, h) {
  if (S.hall.infirmary < 3 || h.status !== 'dead' || S.gold < resurrectCost(h)) return false;
  S.gold -= resurrectCost(h); h.status = 'wounded'; h.wound = 2; h.hp = Math.round(heroMax(h) * 0.3);
  h.morale = 40; hist(h, S, 'Resurrected. Smells faintly of soil.');
  note(S, `${h.name} was resurrected. They will not stop talking about the light.`, 'good');
  return true;
}

function endNight(S) {
  // returns 'over' | 'won' | 'next'
  if (S.gold < 0) { S.debtNights++; } else S.debtNights = 0;
  S.stats.days = S.day;
  if (S.debtNights >= 2) { S.phase = 'over'; S.overReason = 'debt'; return 'over'; }
  if (!alive(S).length) { S.phase = 'over'; S.overReason = 'empty'; return 'over'; }
  if (S.renown >= RANKS[RANKS.length - 1].at && !S.won) { S.won = true; S.phase = 'won'; return 'won'; }
  S.day++;
  startDay(S);
  return 'next';
}

function withTrait(S, t) { return readyAlive(S).filter(h => has(h, t)); }

function pickEvent(S) {
  const recent = S.flags.recentEvents || [];
  const pool = EVENTS.filter(e => !recent.includes(e.id));
  for (let i = 0; i < 8; i++) {
    const e = rpick(S, pool);
    const ctx = e.need(S);
    if (ctx) {
      S.flags.recentEvents = recent.concat(e.id).slice(-6);
      const ids = {}; Object.keys(ctx).forEach(k => { ids[k] = ctx[k].id; });
      return { id: e.id, ids, text: e.text(ctx), choices: e.choices.map(c => c.label) };
    }
  }
  return null;
}

  const res = def.choices[idx].run(S, ctx);
  E.eventDone = true; E.eventResult = res;

}

  let last = performance.now(), nextBark = 1.5, i = 0;
  const lines = [['h2', 'Pip has reconsidered.'], ['h0', 'COME ON THEN!'], ['h1', 'Stand back. Further. FURTHER.'], ['h3', 'I am praying for you. Not hard.'], ['h2', "I'd like to formally reconsider."], ['h0', 'Is it looking at me? I hope it is.']];
  const loop = now => {

    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    nextBark -= dt; if (nextBark <= 0) { const [k, t] = lines[i++ % lines.length]; th.bark(th.actors[k], t); nextBark = 2.6; if (i % 3 === 0) { th.actors.m0.lungeT = 0; th.actors.m0.lungeOn = true; } }

/* ---------------- board ---------------- */

function addCaption(text, cls) {

    return `<div class="unit ${r < 0.35 ? 'low' : ''} ${st ? 'out' : ''}"><div class="nm"><b>${esc(a.name)}</b><span class="num">${st || Math.max(0, Math.round(a.hp)) + '/' + a.maxhp}</span></div><div class="hp"><i style="width:${st === 'fled' ? r * 100 : st ? 0 : r * 100}%"></i></div></div>`;
