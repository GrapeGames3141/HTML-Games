<!doctype html><meta charset="utf-8" /><meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>
<title>Volcanic Island Walk</title>
<style>
  * {
    box-sizing: border-box;
  }
  html,
  body,
  canvas {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #88c9dd;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #ui {
    position: fixed;
    inset: 0;
    color: #f7f2e8;
    pointer-events: none;
    font: 11px system-ui;
    letter-spacing: 0.12em;
    text-shadow: 0 1px 3px #123;
  }
  h1 {
    position: absolute;
    left: 29px;
    top: 24px;
    margin: 0;
    font: 500 22px Georgia;
    letter-spacing: 0.18em;
  }
  p {
    position: absolute;
    left: 30px;
    bottom: 19px;
    margin: 0;
    font-size: 10px;
  }
  nav {
    position: absolute;
    right: 22px;
    bottom: 20px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
    pointer-events: auto;
  }
  #touch {
    display: none;
    position: absolute;
    inset: auto 0 14px;
    justify-content: space-between;
    padding: 0 16px;
    pointer-events: auto;
  }
  .pad {
    width: 92px;
    height: 92px;
    border: 1px solid #e9f3d580;
    border-radius: 50%;
    background: #174b5766;
    display: grid;
    place-items: center;
    color: #f7f2e8cc;
    font-size: 9px;
    touch-action: none;
  }
  button {
    min-width: 40px;
    min-height: 40px;
    border: 1px solid #dce9d6aa;
    border-radius: 16px;
    padding: 7px 12px;
    background: #174b57b8;
    color: #fff;
    font: 10px system-ui;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  button[aria-pressed="true"],
  button:focus-visible {
    background: #2a7484;
    border-color: #fff;
    outline: 2px solid #e9f3d5;
    outline-offset: 2px;
  }
  #error {
    display: none;
    place-items: center;
    position: fixed;
    inset: 0;
    background: #123;
    color: #fff;
    font: 16px system-ui;
    z-index: 4;
  }
  #loading { position:fixed; inset:0; display:grid; place-items:center; color:#f7f2e8; background:#286779; font:14px system-ui; letter-spacing:.12em; z-index:3; }
  @media (max-width: 560px), (pointer: coarse) {
    p {
      bottom: 76px;
      left: 20px;
    }
    nav {
      right: 12px;
      bottom: 14px;
      gap: 4px;
    }
    #touch { display: flex; }
    nav { bottom: 116px; }
    button {
      padding: 6px 9px;
      font-size: 9px;
    }
  }</style
><canvas></canvas>
<div id="ui">
  <h1>VOLCANIC ISLAND WALK</h1>
  <p id="hint">WASD to walk · drag to look · swim inside the reef</p>
  <nav>
    <button data-view="walk" aria-pressed="true">WALK</button>
    <button data-view="0" aria-pressed="false">AERIAL</button>
    <button data-view="1" aria-pressed="false">STRAND</button>
    <button data-view="2" aria-pressed="false">REEF</button>
    <button data-view="falls" aria-pressed="false">FALLS</button>
    <button data-view="lava" aria-pressed="false">LAVA</button>
    <button data-view="mute" aria-pressed="false">SOUND</button>
  </nav>
  <div id="touch"><div class="pad" id="movePad">MOVE</div><div class="pad" id="lookPad">LOOK</div></div>
</div>
<div id="loading">Generating island…</div><div id="error">This island needs WebGL 2.</div>

    const skyV = `#version 300 es

precision highp float;

c2 flatOff=flatRay.xz/(-flatRay.y)*rayDepth;

    const meshV = `#version 300 es
precision highp float;
layout(location=0)in vec3 p;layout(location=1)in vec3 n;layout(location=2)in vec3 c;layout(location=3)in vec2 wind;
uniform mat4 m;uniform float time;uniform bool landPass;
