<!doctype html><meta charset="utf-8" /><meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>
<title>Volcanic Island Walk</title>
<style>
  * {
    box-sizing: border-box;
  }
  html,
  body,
  canvas {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #88c9dd;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #ui {
    position: fixed;
    inset: 0;
    color: #f7f2e8;
    pointer-events: none;
    font: 11px system-ui;
    letter-spacing: 0.12em;
    text-shadow: 0 1px 3px #123;
  }
  h1 {
    position: absolute;
    left: 29px;
    top: 24px;
    margin: 0;
    font: 500 22px Georgia;
    letter-spacing: 0.18em;
  }
  p {
    position: absolute;
    left: 30px;
    bottom: 19px;
    margin: 0;
    font-size: 10px;
  }
  nav {
    position: absolute;
    right: 22px;
    bottom: 20px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
    pointer-events: auto;
  }
  #touch {
    display: none;
    position: absolute;
    inset: auto 0 14px;
    justify-content: space-between;
    padding: 0 16px;
    pointer-events: auto;
  }
  .pad {
    width: 92px;
    height: 92px;
    border: 1px solid #e9f3d580;
    border-radius: 50%;
    background: #174b5766;
    display: grid;
    place-items: center;
    color: #f7f2e8cc;
    font-size: 9px;
    touch-action: none;
  }
  button {
    min-width: 40px;
    min-height: 40px;
    border: 1px solid #dce9d6aa;
    border-radius: 16px;
    padding: 7px 12px;
    background: #174b57b8;
    color: #fff;
    font: 10px system-ui;
    letter-spacing: 0.08em;
    cursor: pointer;
  }
  button[aria-pressed="true"],
  button:focus-visible {
    background: #2a7484;
    border-color: #fff;
    outline: 2px solid #e9f3d5;
    outline-offset: 2px;
  }
  #error {
    display: none;
    place-items: center;
    position: fixed;
    inset: 0;
    background: #123;
    color: #fff;
    font: 16px system-ui;
  }
  @media (max-width: 560px) {
    p {
      bottom: 76px;
      left: 20px;
    }
    nav {
      right: 12px;
      bottom: 14px;
      gap: 4px;
    }
    #touch { display: flex; }
    nav { bottom: 116px; }
    button {
      padding: 6px 9px;
      font-size: 9px;
    }
  }</style
><canvas></canvas>
<div id="ui">
  <h1>VOLCANIC ISLAND WALK</h1>
  <p id="hint">WASD to walk · drag to look · swim inside the reef</p>
  <nav>
    <button data-view="walk" aria-pressed="true">WALK</button>
    <button data-view="0" aria-pressed="false">AERIAL</button>
    <button data-view="1" aria-pressed="false">STRAND</button>
    <button data-view="2" aria-pressed="false">REEF</button>
    <button data-view="falls" aria-pressed="false">FALLS</button>
    <button data-view="lava" aria-pressed="false">LAVA</button>
    <button data-view="mute" aria-pressed="false">SOUND</button>
  </nav>
  <div id="touch"><div class="pad" id="movePad">MOVE</div><div class="pad" id="lookPad">LOOK</div></div>
</div>
<div id="error">This island needs WebGL 2.</div>
<script>
  (() => {
    const canvas = document.querySelector("canvas"),
      gl = canvas.getContext("webgl2", { antialias: true, depth: true }),
      error = document.querySelector("#error");
    if (!gl) {
      error.style.display = "grid";
      return;
    }
    function program(v, f) {
      const p = gl.createProgram();
      for (const [type, s] of [
        [gl.VERTEX_SHADER, v],
        [gl.FRAGMENT_SHADER, f],
      ]) {
        const q = gl.createShader(type);
        gl.shaderSource(q, s);
        gl.compileShader(q);
        if (!gl.getShaderParameter(q, gl.COMPILE_STATUS))
          throw Error(gl.getShaderInfoLog(q));
        gl.attachShader(p, q);
      }
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS))
        throw Error(gl.getProgramInfoLog(p));
      return p;
    }
    const skyV = `#version 300 es
layout(location=0)in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`;
    const skyF = `#version 300 es
precision highp float;
in vec2 uv; out vec4 o;
uniform float t, aspect, tanHalfFov;
uniform vec3 eye, forward, right, up;
uniform sampler2D bathy;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}
float fb(vec2 p){return .516*(n(p)+.5*n(p*2.02)+.25*n(p*4.1)+.125*n(p*8.2)+.0625*n(p*16.4));}
float field(vec2 p){return fb(p+1.5*vec2(fb(p*.55+8.),fb(p*.55-12.)));}
vec3 sky(vec3 d){vec3 sun=normalize(vec3(-.64,.48,.55));float hi=max(d.y,0.);vec3 c=mix(vec3(.70,.83,.87),vec3(.10,.34,.61),pow(hi,.55));vec2 p=d.xz/max(.065,d.y+.065)*2.4+vec2(.0009*t,0.);float den=smoothstep(.55,.72,field(p)+.07*fb(p*2.7));float light=clamp(.52+3.8*(field(p)-field(p+.18*sun.xz)),.15,1.);vec3 cloud=mix(vec3(.55,.64,.70),vec3(.99,.98,.91),light);c=mix(c,cloud,den*.74);float disk=pow(max(dot(d,sun),0.),700.);c+=vec3(1.,.79,.48)*(disk*5.+pow(max(dot(d,sun),0.),18.)*.18);return mix(vec3(.60,.76,.81),c,smoothstep(.012,.105,max(d.y,0.)));}
void main(){vec2 screen=uv*2.-1.;vec3 ray=normalize(forward+right*screen.x*aspect*tanHalfFov+up*screen.y*tanHalfFov);if(ray.y>=0.){o=vec4(sky(ray),1.);return;}float hit=-eye.y/ray.y;vec2 xz=eye.xz+ray.xz*hit;vec2 map=xz/vec2(300.,200.)+.5;float border=1.-max(abs(map.x*2.-1.),abs(map.y*2.-1.));float inMap=smoothstep(-.14,.20,border);float depth=mix(24.,texture(bathy,map).r*22.,inMap);float ra=atan(xz.y/124.,xz.x/164.);float rr=length(xz/vec2(164.,124.))/(1.+.052*sin(ra*3.+.45)+.025*sin(ra*7.-1.2));float reefBand=smoothstep(.84,.93,rr)*(1.-smoothstep(1.01,1.10,rr));depth=mix(depth,min(depth,.58+.55*fb(xz*.035)),reefBand);mat2 swizz=mat2(.82,.57,-.57,.82);vec2 q=swizz*xz;float warp=2.8*n(xz*.055)+.7*n(xz*.23);float pixel=max(length(dFdx(xz)),length(dFdy(xz)));float fine=1.-smoothstep(.18,.9,pixel);vec2 g=q*vec2(.125,.19)+vec2(t*.032,-t*.021);vec2 slope=.17*vec2(n(g+vec2(.09,0))-n(g-vec2(.09,0)),n(g+vec2(0,.09))-n(g-vec2(0,.09)))/.18*(1.-smoothstep(1.,6.,pixel));slope+=vec2(.93,.36)*.13*cos(dot(q,vec2(.93,.36))*3.3+warp*4.-t*2.2)*fine;slope+=vec2(-.35,.94)*.10*cos(dot(q,vec2(-.35,.94))*2.1-warp*3.+t*1.7)*fine;slope+=vec2(.71,-.70)*.08*cos(dot(q,vec2(.71,-.70))*6.6+warp*5.-t*2.9)*fine;slope+=vec2(.14,.99)*.055*cos(dot(q,vec2(.14,.99))*11.8-warp*7.+t*3.5)*fine;vec3 N=normalize(vec3(-slope.x,1.,-slope.y));vec2 floorXZ=xz+N.xz*min(depth,5.)*.75;float reef=fb(floorXZ*.11+vec2(warp*.22,-warp*.17));float detail=fb(floorXZ*.68);vec3 sand=vec3(.82,.77,.56);vec3 coral=mix(vec3(.20,.33,.26),vec3(.05,.43,.36),detail);vec3 seabed=mix(sand,coral,smoothstep(.43,.65,reef));vec3 deep=vec3(.025,.20,.34);vec3 trans=exp(-depth/max(.38,-ray.y)*vec3(.50,.19,.12));vec3 body=mix(deep,seabed,trans);float veins=abs(sin(floorXZ.x*3.8+warp*4.)*sin(floorXZ.y*4.6-warp*3.));body+=vec3(.17,.16,.08)*smoothstep(.78,.96,veins)*exp(-depth*.6);float fres=.04+.90*pow(1.-max(dot(-ray,N),0.),4.);vec3 sun=normalize(vec3(-.64,.48,.55));vec3 refl=reflect(ray,N);vec3 roughSky=mix(sky(refl),mix(vec3(.60,.76,.81),vec3(.21,.49,.69),clamp(refl.y,0.,1.)),.45+.45*smoothstep(150.,750.,hit));vec3 c=mix(body,roughSky,fres);c+=vec3(1.,.80,.46)*pow(max(dot(normalize(-ray+sun),N),0.),240.)*(.25+.75*fine);float phase=fract((depth*.42-t*.16+fb(floorXZ*.35))*1.7);float lace=fb(floorXZ*1.1+vec2(t*.05,-t*.03));float foam=smoothstep(.08,1.4,depth)*(1.-smoothstep(1.4,3.5,depth))*smoothstep(.92,.985,phase)*smoothstep(.42,.70,lace);c=mix(c,vec3(.94,.97,.89),foam*.72);c=mix(c,vec3(.60,.76,.81),1.-exp(-hit*.0009));o=vec4(c,1.);}`;
    const meshV = `#version 300 es
precision highp float;layout(location=0)in vec3 p;layout(location=1)in vec3 n;layout(location=2)in vec3 c;uniform mat4 m;out vec3 albedo,world,normal;void main(){world=p;normal=n;albedo=c;gl_Position=m*vec4(p,1);}`;
    const meshF = `#version 300 es
precision highp float;in vec3 albedo,world,normal;out vec4 o;uniform sampler2D shade;uniform vec3 sun;uniform bool landPass;float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}float fb(vec2 p){return n(p)+.5*n(p*2.03)+.25*n(p*4.1);}
void main(){if(world.y<0.)discard;vec3 N=normalize(normal);float steep=1.-N.y,rock=landPass?smoothstep(.18,.52,steep):0.;vec2 face=vec2(world.x+.57*world.z,world.y);float joint=face.x*.175+face.y*.094+.49*n(face*.21)+.15*n(face*.87);float bed=world.y+.21*world.x-.105*world.z+.22*floor(joint+.5)+.66*fb(world.xz*.42)+.20*sin(face.x*.61);float silt=fb(vec2(face.x*.26,bed*1.65)),seam=abs(fract(bed*.49+.13*sin(bed*1.21))-.5),chips=fb(vec2(face.x*1.13,bed*2.75));vec3 basalt=mix(vec3(.23,.24,.22),vec3(.46,.39,.30),silt*.48);basalt*=.80+.20*chips;basalt*=1.-.10*smoothstep(.03,.11,seam);float grain=.94+.06*sin(world.x*2.1+sin(world.z*1.3))*sin(world.z*1.7),occlusion=landPass?texture(shade,world.xz/vec2(300.,200.)+.5).r:1.;vec3 base=mix(albedo*grain,basalt,rock);float direct=max(dot(N,normalize(sun)),0.);vec3 lit=base*(.34+.66*direct)*occlusion;o=vec4(pow(max(lit,0.),vec3(.64)),1);}`;
    const leafV = `#version 300 es
precision highp float;layout(location=0)in vec3 p;layout(location=1)in vec2 uv;layout(location=2)in vec3 c;uniform mat4 m;out vec2 vuv;out vec3 col;void main(){vuv=uv;col=c;gl_Position=m*vec4(p,1);}`;
    const leafF = `#version 300 es
precision highp float;in vec2 vuv;in vec3 col;uniform sampler2D atlas;out vec4 o;void main(){vec4 a=texture(atlas,vuv);if(a.a<.32)discard;o=vec4(a.rgb*col,1);}`;
    let S, M, Q;
    try {
      S = program(skyV, skyF);
      M = program(meshV, meshF);
      Q = program(leafV, leafF);
    } catch (e) {
      error.textContent = "Shader error: " + e;
      error.style.display = "grid";
      return;
    }
    function mul(a, b) {
      const r = new Float32Array(16);
      for (let y = 0; y < 4; y++)
        for (let x = 0; x < 4; x++)
          r[x * 4 + y] =
            a[y] * b[x * 4] +
            a[4 + y] * b[x * 4 + 1] +
            a[8 + y] * b[x * 4 + 2] +
            a[12 + y] * b[x * 4 + 3];
      return r;
    }
    function norm(a) {
      let l = Math.hypot(...a);
      return a.map((x) => x / l);
    }
    function cross(a, b) {
      return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0],
      ];
    }
    function perspective(a, n, f, tanHalfFov) {
      let q = 1 / (n - f),
        s = 1 / tanHalfFov;
      return new Float32Array([
        s / a,
        0,
        0,
        0,
        0,
        s,
        0,
        0,
        0,
        0,
        (f + n) * q,
        -1,
        0,
        0,
        2 * f * n * q,
        0,
      ]);
    }
    function look(e, t) {
      let z = norm([e[0] - t[0], e[1] - t[1], e[2] - t[2]]),
        x = norm(cross([0, 1, 0], z)),
        y = cross(z, x);
      return new Float32Array([
        x[0],
        y[0],
        z[0],
        0,
        x[1],
        y[1],
        z[1],
        0,
        x[2],
        y[2],
        z[2],
        0,
        -x[0] * e[0] - x[1] * e[1] - x[2] * e[2],
        -y[0] * e[0] - y[1] * e[1] - y[2] * e[2],
        -z[0] * e[0] - z[1] * e[1] - z[2] * e[2],
        1,
      ]);
    }
    function noise(x, z) {
      let a = Math.floor(x),
        b = Math.floor(z),
        u = x - a,
        v = z - b,
        r = (i, j) => {
          let k = Math.sin(i * 127.1 + j * 311.7) * 43758.5;
          return k - Math.floor(k);
        };
      u = u * u * (3 - 2 * u);
      v = v * v * (3 - 2 * v);
      return (
        (r(a, b) * (1 - u) + r(a + 1, b) * u) * (1 - v) +
        (r(a, b + 1) * (1 - u) + r(a + 1, b + 1) * u) * v
      );
    }
    function H(x, z) {
      let wx = x + (noise(x * 0.018, z * 0.018) - 0.5) * 13,
        wz = z + (noise(x * 0.018 + 7, z * 0.018 - 4) - 0.5) * 11,
        coast = Math.max(-8, 10 * (1 - Math.hypot(x / 130, z / 84))),
        g = (a, b, s, h) =>
          h * Math.exp(-(((wx - a) / s) ** 2) - ((wz - b) / (s * 0.72)) ** 2),
        dx = wx + 10,
        dz = (wz + 4) / 0.77,
        radius = Math.hypot(dx, dz),
        angle = Math.atan2(dz, dx),
        ramp = Math.min(1, radius / 7) * Math.max(0, 1 - radius / 63),
        ribs = Math.pow(
          0.5 +
            0.5 *
              Math.cos(
                10 * angle +
                  0.075 * radius +
                  3 * (noise(wx * 0.065, wz * 0.065) - 0.5),
              ),
          2.6,
        ),
        peaks = Math.max(
          g(-61, -14, 32, 36),
          Math.max(
            g(-10, -4, 32, 64) * (1 - 0.48 * ramp * ribs),
            g(-23, -10, 13, 48),
          ),
          g(40, 12, 25, 27),
        ),
        ridge = Math.abs(noise(wx * 0.075, wz * 0.075) - 0.5),
        gully = Math.abs(noise(wx * 0.19, wz * 0.19) - 0.5);

        coast +
        peaks -
        g(64, 8, 34, 23) +
        (ridge * 8 + gully * 3 + (noise(wx * 0.38, wz * 0.38) - 0.5) * 1.5) *
          Math.max(0, 1 - Math.hypot(x / 142, z / 94))
      );
    }
    const bathy = gl.createTexture(),
      bathyPixels = new Uint8Array(256 * 256);
    for (let j = 0; j < 256; j++)
      for (let i = 0; i < 256; i++) {
        let x = -150 + (300 * i) / 255,
          z = -100 + (200 * j) / 255,
          depth = Math.max(0.15, Math.min(22, -H(x, z)));
        bathyPixels[j * 256 + i] = (depth / 22) * 255;
      }
    gl.bindTexture(gl.TEXTURE_2D, bathy);
    gl.texImage2D(
      gl.TEXTURE_2D,
      0,
      gl.R8,
      256,
      256,
      0,
      gl.RED,
      gl.UNSIGNED_BYTE,
      bathyPixels,
    );
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    function normal(x, z) {
      let e = 0.4;
      return norm([
        H(x - e, z) - H(x + e, z),
        2 * e,
        H(x, z - e) - H(x, z + e),
      ]);
    }
    function gridHeight(x, z) {
      let sx = 300 / 180,
        sz = 200 / 120,
        u = Math.max(0, Math.min(179.999, (x + 150) / sx)),
        v = Math.max(0, Math.min(119.999, (z + 100) / sz)),
        i = Math.floor(u),
        j = Math.floor(v),
        fx = u - i,
        fz = v - j,
        a = H(-150 + i * sx, -100 + j * sz),
        b = H(-150 + (i + 1) * sx, -100 + j * sz),
        c = H(-150 + i * sx, -100 + (j + 1) * sz),
        d = H(-150 + (i + 1) * sx, -100 + (j + 1) * sz);

        ? a * (1 - fx - fz) + b * fx + c * fz
        : b * (1 - fz) + c * (1 - fx) + d * (fx + fz - 1);
    }
    const REEF_X = 164,
      REEF_Z = 124;
    function reefLimit(angle) {
      return (
        1 +
        0.052 * Math.sin(angle * 3 + 0.45) +
        0.025 * Math.sin(angle * 7 - 1.2)
      );
    }
    function reefMargin(x, z) {
      let angle = Math.atan2(z / REEF_Z, x / REEF_X),
        radius = Math.hypot(x / REEF_X, z / REEF_Z);
      return reefLimit(angle) - radius;
    }
    function makeMesh(P, N, C, I) {
      let v = gl.createVertexArray();
      gl.bindVertexArray(v);
      [
        [P, 0],
        [N, 1],
        [C, 2],
      ].forEach(([d, i]) => {
        let b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(d), gl.STATIC_DRAW);

        gl.vertexAttribPointer(i, 3, gl.FLOAT, false, 0, 0);

      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, b);

        gl.ELEMENT_ARRAY_BUFFER,
        new Uint32Array(I),
        gl.STATIC_DRAW,
      );

    let P = [],
      N = [],
      C = [],
      L = [],
      nx = 181,
      nz = 121;
    for (let z = 0; z < nz; z++)
      for (let x = 0; x < nx; x++) {

          b = -100 + (200 * z) / (nz - 1),

          q = normal(a, b),
          beach = y < 2.0 + 1.5 * noise(a * 0.04, b * 0.04),

          g = noise(a * 0.19, b * 0.19),
          submerged = y <= 0,
          fade = Math.max(
            0,
            Math.min(1, (Math.hypot(a / 150, b / 100) - 0.54) / 0.43),

            ? [
                0.42 * (1 - fade) + 0.025 * fade,
                0.49 * (1 - fade) + 0.18 * fade,
                0.34 * (1 - fade) + 0.3 * fade,
              ]
            : beach
              ? [0.78 + 0.12 * g, 0.66 + 0.11 * g, 0.39 + 0.07 * g]

                ? [0.18 + 0.16 * g, 0.19 + 0.14 * g, 0.17 + 0.11 * g]

                    0.1 + 0.075 * g + 0.035 * noise(a * 0.47, b * 0.47),
                    0.26 + 0.17 * g + 0.045 * noise(a * 0.11 + 8, b * 0.11),

        N.push(...q);
        C.push(...c);
      }

          c = a + nx,
          d = c + 1;

      pP = [],
      pN = [],
      pC = [],
      pI = [];

    }
    function palm(x, z, y, h) {
      let q = [x, y, z];

            x + Math.sin(t * 1.8) * 0.6,
            y + h * t,
            z + Math.cos(t * 1.4) * 0.42,
          ],
          a = [],
          b = [];
        for (let i = 0; i < 7; i++) {
          let k = (i * Math.PI * 2) / 7,
            r = 0.34 * (1 - t * 0.78);

          player.pitch = Math.max(-1.12, Math.min(1.12, player.pitch - dy * 0.009));
        } else touchMove = [Math.max(-1, Math.min(1, (x.clientX - origin.clientX) / 34)), Math.max(-1, Math.min(1, (x.clientY - origin.clientY) / 34))];
      };
      element.onpointerup = element.onpointercancel = () => { previous = origin = null; if (!look) touchMove = [0, 0]; };
    }
    touchZone(document.querySelector("#movePad"), false);
    touchZone(document.querySelector("#lookPad"), true);
    window.ISLAND = {
      ready: true,
      state: () => ({
        mode,
        medium,
        player: { ...player },
        groundElevation: gridHeight(player.x, player.z),
        reefMargin: reefMargin(player.x, player.z),
        sound: { enabled: !!audio.ctx, muted: audio.muted, events: audio.events },
        effects: { tracks: tracks.length, grains: grains.length, ripples: ripples.length, splashes: splashCount },
        landmarks: { falls: fallsPath.length, lava: lavaPath.length },
        view,
        a,
        e,
        d,
        broadleafRoots: leafRoots.length,
        palmRoots: palmRoots.length,
        boulderGroups,
        boulderCount,
        atlasAlpha,
      }),
      view: setView,
      walk: setWalk,
      testSpawn: (x, z) => {
        player.x = x;
        player.z = z;
        setWalk();
      },
    };
  })();
</script>
