<!doctype html>
<html lang="en">
  <head>

    <title>Littoral — Astra Field Atlas</title>

    <style>
      :root {
        color-scheme: dark;
        --ink: #142e2e;
        --paper: #f6f1dc;
        --muted: #b9c8be;
        --accent: #edc680;
        --rule: #b7c9ba52;
        font:

      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #203f45;
        color: var(--paper);
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }
      canvas#view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      button,
      select,
      input {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
        color: inherit;
        background: transparent;
        border: 1px solid var(--rule);

        position: absolute;
        top: 15%;
        padding: 5px 8px;
        background: #183433df;
        white-space: nowrap;

      #compare span:first-child {
        right: 5px;
      }
      #compare span:last-child {
        left: 5px;
      }

        position: absolute;
        left: 50%;
        top: 16%;
        transform: translateX(-50%);
        background: #132e30ea;
        padding: 8px 15px;
        border-radius: 3px;
        text-align: center;
      }
      #dial {
        position: absolute;
        left: 50%;
        bottom: 130px;

      }
      .touchActions {

        bottom: 122px;
        display: flex;
        gap: 5px;
        align-items: center;
      }
      .touchActions button {
        background: #173637d9;
        padding: 10px;
      }
      .stick {
        position: fixed;
        width: 74px;
        height: 74px;
        border: 1px solid #fff8;
        border-radius: 50%;
        background: #1233;
        pointer-events: none;
      }
      .stick i {
        position: absolute;
        left: 25px;
        top: 25px;
        width: 23px;
        height: 23px;
        border-radius: 50%;
        background: #f4ebcbaa;
      }

        position: fixed;
        right: max(20px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
      }
      #photoTools button {
        background: var(--ink);
      }

        position: fixed;
        inset: 20%;
        padding: 25px;
        background: var(--ink);

      }

        color: var(--accent);
        border: 0;
        text-decoration: underline;
        font-size: 12px;
        padding: 5px;

      }

      }

        }

        }

        }
        .touchActions {

        }
        .stationInfo h2 {

        }
        .stationInfo p {

        }

      @media (max-width: 560px) {
        .brand .small {
          display: none;
        }
        .stationNav button span {

        }
        .stationNav button {
          padding: 9px 0;
        }
        .stationNav button[aria-current='true'] {
          flex: 2;
        }
        .stationNav button[aria-current='true'] span {
          display: inline;
        }
        .stationInfo .readout {
          display: none;
        }
        .touchActions {
          bottom: 130px;
        }
        .touch-layout #portrait {
          display: block;
          color: var(--muted);
          font-size: 11px;
          margin-top: 8px;
        }
        .card h1 {
          font-size: 56px;
        }
      }
    </style>

  <body>

          >Littoral <span class="small">Astra Field Atlas</span>

        <div class="group">
          <span id="perf" class="readout"></span><button id="menu">Effects &nbsp; ☰</button>

      <div id="cross" hidden></div>
      <div id="compare" hidden><span class="chip">Effect on</span><span class="chip">Stand-in</span></div>

        </p>
        <div class="rule"></div>
        <div id="guide" class="guide"></div>
        <details>
          <summary>More controls</summary>
          <div id="extraGuide" class="guide"></div>
        </details>
        <div id="padGuide" class="guide" hidden></div>
        <div class="row">
          <button id="begin" class="primary">Begin the walk &nbsp; →</button
          ><button id="swapGuide" class="textLink"></button>
        </div>
        <span id="portrait">Landscape gives a wider view of the coast.</span>
      </section>
      <aside id="panel" class="panel" hidden>
        <div class="bar">
          <h2>Effects</h2>
          <button id="closePanel" aria-label="Close effects">×</button>
        </div>

      <div id="dial" class="glass" hidden>

      </div>
      <div class="touchActions" id="touchActions" hidden>
        <button id="rise" hidden>↑</button><button id="sink" hidden>↓</button><button id="use" hidden></button
        ><button id="throw">Throw</button><button id="holdSplit">Split</button>
      </div>
      <div id="stick" class="stick" hidden><i></i></div>
      <div id="bottom">
        <div class="stationInfo">
          <div>
            <div id="stationNo" class="eyebrow"></div>
            <h2 id="stationName"></h2>
            <p id="caption"></p>
          </div>
          <span id="context" class="readout"></span>
        </div>
        <nav id="route" aria-label="Field stations" class="stationNav"></nav>
      </div>
    </div>
    <div id="photoTools" hidden>
      <button id="save">Save picture</button> <button id="exitPhoto">Exit photo mode</button>
    </div>
    <div id="fatal" role="alert" hidden></div>
    <script>

        canvas = $('view'),
        params = new URLSearchParams(location.search);
      const test = params.has('test'),
        touch = params.has('touch') || (!params.has('desktop') && matchMedia('(pointer:coarse)').matches);
      const gl = canvas.getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false });
      function fatal(e) {

      }
      if (!gl) throw (fatal('WebGL 2 is required.'), new Error('WebGL 2 required'));
      const floatOK = !!gl.getExtension('EXT_color_buffer_float') && !params.has('nofloat');

      const S = {
        x: 0,
        y: 0,
        z: 0,
        yaw: 0,

        time: 0,
        station: 0,

      const shore = (x) => 72 + 5 * sin(x * 0.048) + 3 * sin(x * 0.084 + 0.9),

        if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowRight', 'ArrowLeft'].includes(k))
          e.preventDefault();
        keys.add(k);
        if (e.repeat && !['BracketLeft', 'BracketRight'].includes(k)) return;
        if (!S.started && (k === 'Enter' || k === 'Space')) {
          start();
          return;
        }
        if (k === 'Tab') panel();
        else if (k === 'Escape') {
          if (S.photo) photo(false);
          else if (S.panel) panel(false);
          $('dial').hidden = true;
        } else if (k === 'KeyH') showControls();
        else if (k === 'KeyP') photo();
        else if (S.photo && k === 'Enter') savePhoto();
        else if (k === 'KeyV') {
          heldV = true;
          splitOn();
        } else if (k === 'Comma' || k === 'Period') pickTarget(k === 'Period' ? 1 : -1);
        else if (k === 'KeyF') setFree();
        else if (k === 'KeyE') interact();
        else if (k === 'KeyQ') cycleQuality();
        else if (k === 'KeyM') measureSoon();
        else if (k === 'KeyN') setSound();
        else if (k === 'BracketLeft' || k === 'BracketRight')
          setSun(S.sun + (k === 'BracketRight' ? 0.045 : -0.045));
        else {
          let id = [
            'Digit1',
            'Digit2',
            'Digit3',
            'Digit4',
            'Digit5',
            'Digit6',
            'Digit7',
            'Digit8',
            'Digit9',
            'Digit0',
            'Minus',
            'Equal'
          ].indexOf(k);
          if (id >= 0) {
            toggle(id + 1);
            notice(effects[id] + ' · ' + (flags[id] ? 'on' : 'off'));
          }
        }
        if (test) render();
      });
      window.addEventListener('keyup', (e) => {
        keys.delete(e.code);
        if (e.code === 'KeyV') {
          heldV = false;
          splitOn();
          if (test) render();
        }
      });
      window.addEventListener('blur', () => {
        keys.clear();
        heldV = heldLB = false;
        joy = [0, 0];
        vertical = 0;
        splitOn();
      });
      let pointers = new Map();
      canvas.onpointerdown = (e) => {
        if (!S.started || S.panel || S.photo) return;
        audioStart();
        let isMouse = e.pointerType === 'mouse';
        if (isMouse && document.pointerLockElement === canvas) {
          throwPebble();
          return;
        }
        let stick =
          !isMouse && e.clientX < innerWidth * 0.45 && !Array.from(pointers.values()).some((p) => p.stick);
        pointers.set(e.pointerId, {
          x: e.clientX,
          y: e.clientY,
          lastX: e.clientX,
          lastY: e.clientY,
          stick,
          isMouse,
          moved: false
        });
        canvas.setPointerCapture(e.pointerId);
        if (stick) {
          let el = $('stick');
          el.hidden = false;
          el.style.left = e.clientX - 37 + 'px';
          el.style.top = e.clientY - 37 + 'px';
          el.firstElementChild.style.transform = 'none';
        }
      };
      canvas.onpointermove = (e) => {
        if (document.pointerLockElement === canvas) {
          setLook(S.yaw + e.movementX * 0.00225, S.pitch - e.movementY * 0.00225);
          return;
        }
        let p = pointers.get(e.pointerId);
        if (!p) return;
        let dx = e.clientX - p.x,
          dy = e.clientY - p.y;
        if (hypot(dx, dy) > 3) p.moved = true;
        if (p.stick) {
          let f = max(37, hypot(dx, dy));
          joy = [dx / f, -dy / f];
          $('stick').firstElementChild.style.transform =
            'translate(' + joy[0] * 27 + 'px,' + -joy[1] * 27 + 'px)';
        } else setLook(S.yaw + (e.clientX - p.lastX) * 0.0041, S.pitch - (e.clientY - p.lastY) * 0.0041);
        p.lastX = e.clientX;
        p.lastY = e.clientY;
      };
      canvas.onpointerup = canvas.onpointercancel = (e) => {
        let p = pointers.get(e.pointerId);
        if (!p) return;
        pointers.delete(e.pointerId);
        if (p.stick) {
          joy = [0, 0];
          $('stick').hidden = true;
        }
        if (e.type === 'pointerup' && p.isMouse && !p.moved && !document.pointerLockElement) {
          try {
            canvas.requestPointerLock()?.catch(() => {});
          } catch {}
        }
      };
      canvas.onwheel = (e) => {
        if (nearestUse() === 'Sundial') {
          e.preventDefault();
          setSun(S.sun + Math.sign(e.deltaY) * 0.03);
          render();
        }
      };
      window.oncontextmenu = (e) => e.preventDefault();
      let bottlePositions, bottleColors;
      const staticStats = { splats: 0, tris: 0 };
      function initialize() {
        initUI();
        buildGround();
        beachDecor();
        woods();
        greenhouse();
        bottlePositions = new Float32Array(bottles.flatMap((b) => b.slice(0, 4)));
        bottleColors = new Float32Array(bottles.flatMap((b) => b.slice(4)));
        cave();
        fieldObjects();
        buildWater();
        staticStats.splats = splatCount;
        staticStats.tris = meshCount;
        for (let g of groups.values()) uploadGroup(g);
        gotoStation(1);
        if (!test) {
          S.yaw = 0.57;
          S.pitch = 0.025;
        }
        applyQuality();
        ready = true;
        render();
        let last = performance.now(),
          lastHud = last;
        function frame(now) {
          let elapsed = (now - last) / 1000,
            dt = clamp(elapsed, 0, 0.075);
          last = now;
          pollPad(dt);
          if (!test) {
            if (!S.panel && S.started) tick(dt);
            if (S.started) render();
            if (now - lastHud > 400) {
              $('perf').textContent = (elapsed * 1000).toFixed(1) + ' ms  /  ' + S.quality;
              lastHud = now;
            }
          }
          loopHandle = requestAnimationFrame(frame);
        }
        loopHandle = requestAnimationFrame(frame);
        window.DEMO = {
          state,
          step,
          goto: gotoStation,
          look: (y, p) => {
            setLook(y, p);
            render();
          },
          lookAt: (...a) => {
            lookAt(...a);
            render();
          },
          toggle: (...a) => {
            let v = toggle(...a);
            render();
            return v;
          },
          all: (on) => {
            flags.fill(!!on);
            updateUI();
            render();
          },
          setSun: (v) => {
            setSun(v);
            render();
          },
          throwPebble,
          cost: measure,
          tp: (...a) => {
            tp(...a);
            render();
            return state();
          },
          walk,
          walkTo: (...a) => {
            walkTo(...a);
            render();
            return state();
          },
          interact: () => {
            let v = interact();
            render();
            return v;
          },
          blow,
          split: (on) => {
            latched = !!on;
            splitOn();
            render();
          },
          free: (on) => {
            setFree(on);
            render();
          },
          cam: (eye, y, p) => {
            tp(
              eye[0],
              eye[2],
              insideTunnel(eye[0], eye[2]) && eye[1] < caveFloor(caveCoord(eye[0], eye[2])[0]) + 5.6
            );
            S.y = eye[1];
            S.free = true;
            setLook(y, p);
            render();
          },
          quality: (q) => {
            quality(q);
            render();
          },
          photo,
          compare: (id) => {
            S.compare = clamp(+id, 0, 13);
            updateUI();
            render();
          },
          route: () => pathNodes.map((p) => [...p]),
          inspect: () => ({
            ripplePeak: sim.h.reduce((a, b) => max(a, abs(b)), 0),
            oceanPeak: ocean.a.reduce((a, b) => max(a, abs(b)), 0),
            glError: gl.getError(),
            size: [canvas.width, canvas.height],
            triangles: staticStats.tris,
            splats: staticStats.splats,
            frameMs
          })
        };
        window.addEventListener('resize', render);
        canvas.addEventListener('webglcontextlost', (e) => {
          e.preventDefault();
          cancelAnimationFrame(loopHandle);
          fatal('Graphics context lost. Reload the page to return to the island.');
        });
      }
      try {
        initialize();
      } catch (error) {
        fatal(error.stack || error);
        throw error;
      }
    </script>
  </body>
</html>
